name: Erinnerungen senden

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub kann ein paar Minuten später starten)
  workflow_dispatch:          # zum Testen auch per Knopfdruck startbar

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node push/push/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
