<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Design sofort anwenden (bevor die Seite gezeichnet wird), damit nichts aufblitzt
  window.applyTheme = function (t) {
    t = t || {};
    var mode = t.mode || "dark", accent = t.accent || "#FFC400", r = document.documentElement;
    if (mode === "system") mode = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    var light = mode === "light" || mode === "white";
    r.dataset.theme = mode;   // dark | black | light | white
    r.style.setProperty("--accent", accent);
    var h = accent.replace("#", ""), R = parseInt(h.substr(0, 2), 16) / 255, G = parseInt(h.substr(2, 2), 16) / 255, B = parseInt(h.substr(4, 2), 16) / 255;
    var lin = function (c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * lin(R) + 0.7152 * lin(G) + 0.0722 * lin(B);
    r.style.setProperty("--accent-ink", L > 0.36 ? "#111111" : "#ffffff");
    // Akzent als Schrift immer lesbar halten (z. B. Schwarz auf dunklem oder Weiß auf hellem Hintergrund)
    r.style.setProperty("--accent-text", light ? (L > 0.45 ? "color-mix(in srgb, " + accent + " 45%, #000)" : accent) : (L < 0.06 ? "#d6d6dc" : accent));
    // Sehr dunkler Akzent im Dunkelmodus / sehr heller im Hellmodus: dünner Rand, damit Kästchen & Balken sichtbar bleiben
    r.style.setProperty("--accent-edge", (!light && L < 0.06) ? "#5a5a63" : (light && L > 0.8) ? "#b9b9c2" : accent);
    // Rang-Designs (Legende: Ranken, Mythos: Farbfluss, GOD-LEVEL: Galaxie) – Vorschau überschreibt gespeicherte Wahl
    var c = Object.assign({}, t.cosm || {}, window.__cosmPreview || {});
    if (c.galaxy && !("bg" in (window.__cosmPreview || {})) && c.bg === undefined) c.bg = "blackhole";   // alte Einstellungen übernehmen
    if (c.vines && c.deco === undefined) c.deco = "vines";
    c.deco = ({ vines: "overgrown", jungle: "overgrown", gold: "" })[c.deco] ?? c.deco; c.bg = ({ embers: "fireflies", sparkle: "starnight" })[c.bg] ?? c.bg;
    r.dataset.deco = c.deco || ""; r.dataset.bg = c.bg || "";
    r.classList.toggle("cosm-bg", !!c.bg);
    r.classList.toggle("cosm-meadow", !!c.meadow);
    var cols = (c.mythColors && c.mythColors.length > 1) ? c.mythColors : ["#C04DFF", "#FF4FA3", "#4CC9F0"];
    r.classList.toggle("cosm-myth", !!c.myth);
    var st = document.getElementById("mythStyle");
    if (!st) { st = document.createElement("style"); st.id = "mythStyle"; document.head.appendChild(st); }
    st.textContent = c.myth ? "@keyframes mythCycle{" + cols.concat([cols[0]]).map(function (col, i, a) { return (i / (a.length - 1) * 100).toFixed(1) + "%{--accent:" + col + "}"; }).join("") + "}"
      + ":root.cosm-myth{--myth-grad:linear-gradient(90deg," + cols.concat(cols).concat([cols[0]]).join(",") + ")}" : "";
    if (window.__onCosm) window.__onCosm(c);
    var bg = { dark: "#0e0e0f", black: "#000000", light: "#f3f3f5", white: "#ffffff" }[mode];
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = bg;
  };
  try { applyTheme(JSON.parse(localStorage.getItem("tracker-theme") || "{}")); } catch (e) { applyTheme({}); }
</script>
<style>
  /* ============ FARBEN ============ */
  :root {
    --accent: #FFC400;          /* Akzentfarbe – in der App unter ⚙ Einstellungen änderbar */
    --accent-ink: #111111;      /* Schrift auf der Akzentfarbe */
    --accent-text: var(--accent);  /* Akzentfarbe als Schrift (im Hellmodus etwas dunkler) */
    --bg: #0e0e0f;
    --surface: #18181a;
    --surface-2: #222225;
    --border: #2e2e33;
    --text: #f2f2f3;
    --muted: #8b8b93;
    --danger: #ff5c5c;
    --radius: 14px;
    --shade: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f3f5;
    --surface: #ffffff;
    --surface-2: #ececef;
    --border: #dcdce2;
    --text: #141416;
    --muted: #6c6c75;
    --shade: rgba(20,20,25,.35);
    color-scheme: light;
  }
  :root[data-theme="white"] {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f2f2f4;
    --border: #e2e2e8;
    --text: #0b0b0c;
    --muted: #6c6c75;
    --shade: rgba(20,20,25,.3);
    color-scheme: light;
  }
  :root[data-theme="black"] {
    --bg: #000000;
    --surface: #0d0d0e;
    --surface-2: #19191b;
    --border: #262629;
    --text: #f4f4f5;
    --muted: #8b8b93;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { min-height: 100dvh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  /* ===== Rang-Designs ===== */
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #FFC400; }
  /* Mythos: Akzentfarbe fließt langsam durch die gewählten Farben */
  :root.cosm-myth { animation: mythCycle 14s linear infinite; --accent-text: var(--accent) !important; --accent-edge: var(--accent) !important; }
  :root.cosm-myth .btn.primary, :root.cosm-myth .chip.accent { background: var(--myth-grad) 0 0 / 200% 100%; animation: mythSlide 6s linear infinite; border-color: transparent; }
  @keyframes mythSlide { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  :root.cosm-myth .switch button.on, :root.cosm-myth .week .box.full, :root.cosm-myth .done .box-check, :root.cosm-myth .check-row.on .box-check,
  :root.cosm-myth .cal .c.full, :root.cosm-myth .cal .c .bar i, :root.cosm-myth .ck-box.on, :root.cosm-myth .dp-d.sel, :root.cosm-myth .dial-tabs button.on, :root.cosm-myth .tw-hl,
  :root.cosm-myth .badge .bar i, :root.cosm-myth nav.bottom .badge, :root.cosm-myth .tc-d .dots i, :root.cosm-myth .legend i[style*="accent"] {
    background-image: var(--myth-grad) !important; background-size: 200% 100% !important; animation: mythSlide 6s linear infinite; border-color: transparent !important; }
  :root.cosm-myth .ach-bar i:not(.god-bar):not(.rank-bar) { background: var(--myth-grad) 0 0 / 200% 100% !important; animation: mythSlide 6s linear infinite; }
  :root.cosm-myth .ring-prog, :root.cosm-myth .chart path[stroke="var(--accent)"] { stroke: url(#mythSvg); }
  :root.cosm-myth .chart path[fill="var(--accent)"], :root.cosm-myth .chart circle[fill="var(--accent)"] { fill: url(#mythSvg); }
  /* Karten-Deko (Gold, Neon, Ornament, Pflanzen) – Pflanzenbilder kommen per JS (DECO) */
  :root[data-deco]:not([data-deco=""]) .card:not(.shine) { position: relative; isolation: isolate; }
  :root[data-deco=gold] .card:not(.shine)::before, :root[data-deco=neon] .card:not(.shine)::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.6px; pointer-events: none; z-index: 2;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; background-size: 300% 100%; animation: decoSweep 7s linear infinite; }
  :root[data-deco=gold] .card:not(.shine)::before { background-image: linear-gradient(115deg, #6d4c0f, #e8bf5a, #fff3c4, #c9962e, #7a5512, #e8bf5a, #fff3c4, #6d4c0f); }
  :root[data-deco=neon] .card:not(.shine)::before { background-image: linear-gradient(90deg, var(--accent), #fff, var(--accent), color-mix(in srgb, var(--accent) 40%, #4CC9F0), var(--accent)); }
  :root[data-deco=neon] .card:not(.shine) { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 28%, transparent), inset 0 0 10px color-mix(in srgb, var(--accent) 10%, transparent); animation: neonPulse 3s ease-in-out infinite alternate; }
  @keyframes decoSweep { to { background-position: 300% 0; } }
  @keyframes neonPulse { to { box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 0 14px color-mix(in srgb, var(--accent) 16%, transparent); } }
  :root[data-deco=overgrown] .card:not(.shine)::before, :root[data-deco=blossom] .card:not(.shine)::before, :root[data-deco=ornament] .card:not(.shine)::before {
    content: ""; position: absolute; inset: -6px; pointer-events: none; z-index: -1; background-repeat: no-repeat; background-position: left top, right bottom; background-size: 96px 96px, 80px 80px; }
  :root[data-deco=ornament] .card:not(.shine)::before { inset: 3px; background-size: 46px 46px, 46px 46px; }
  :root[data-deco=overgrown] .card:not(.shine)::before { inset: -12px -6px -6px -6px; }
  :root[data-deco=blossom] .card:not(.shine)::before { inset: -26px -4px -6px -4px; }
  /* Wiese mit Hasen auf der unteren Leiste */
  :root.cosm-meadow nav.bottom::before { content: ""; position: absolute; left: 0; right: 0; top: -24px; height: 30px; pointer-events: none; background-repeat: repeat-x; background-position: left bottom; background-size: 180px 30px; }
  .bunny { position: absolute; bottom: calc(100% - 4px); left: 0; width: 46px; height: 36px; pointer-events: none; z-index: 1; }
  .bunny .bb { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .bunny.hop .bb { animation: bunnyHop .46s cubic-bezier(.3,.7,.4,1) infinite; }
  .bunny.rest .ear { animation: earWig .5s ease-in-out 3 alternate; transform-origin: 30px 12px; }
  @keyframes bunnyHop { 0%, 100% { transform: translateY(0) scale(1.08, .9); } 15% { transform: translateY(-4px) scale(.94, 1.08); } 50% { transform: translateY(-16px) scale(1, 1); } 85% { transform: translateY(-2px) scale(.98, 1.04); } }
  @keyframes earWig { to { transform: rotate(-12deg); } }
  /* Hintergrund-Szenen */
  #bgfx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: none; }
  :root.cosm-bg #bgfx { display: block; }
  :root.cosm-bg, :root.cosm-bg body { background: #05040a; }
  :root.cosm-bg .app { position: relative; z-index: 1; }
  :root.cosm-bg .card, :root.cosm-bg .task, :root.cosm-bg .todo, :root.cosm-bg .rec2, :root.cosm-bg .kpi { background-color: color-mix(in srgb, var(--surface) 62%, transparent); border-color: rgba(255,255,255,.12); }
  :root.cosm-bg nav.bottom { background: rgba(5,4,10,.72); }
  .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); text-align: left; min-width: 0; }
  .opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .opt .oe { font-size: 22px; flex: none; }
  .opt b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt.lock { opacity: .55; }
  .sub-h { font-size: 12px; font-weight: 800; color: var(--muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }
  /* Einstellungen: Rang-Designs */
  .cosm-row { display: flex; gap: 12px; align-items: center; padding: 12px; }
  .cosm-row .ci { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; background: var(--surface-2); }
  .cosm-row .cb { flex: 1; min-width: 0; }
  .cosm-row .cb b { display: block; font-size: 15px; }
  .cosm-row .cb small { color: var(--muted); font-size: 12px; line-height: 1.35; display: block; }
  .cosm-cols { display: flex; gap: 8px; align-items: center; padding: 0 12px 12px; flex-wrap: wrap; }
  .cosm-cols input[type=color] { width: 36px; height: 36px; border: 0; padding: 0; border-radius: 10px; background: none; }
  .cosm-cols input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .cosm-cols input[type=color]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 10px; }

  /* Layout */
  .app { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
  .eyebrow { color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: .02em; }
  h1 { font-size: 26px; font-weight: 800; margin: 2px 0 0; letter-spacing: -.02em; }
  h2 { font-size: 15px; font-weight: 700; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); }
  .icon-btn svg { width: 20px; height: 20px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .chip.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge, var(--accent)); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge, var(--accent)); }
  .btn.block { width: 100%; }
  .muted { color: var(--muted); }

  /* Hero / Fortschritt */
  .hero { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .num b { font-size: 26px; font-weight: 800; display: block; line-height: 1; }
  .ring .num span { font-size: 12px; color: var(--muted); }
  .hero-text .big { font-size: 18px; font-weight: 700; }
  .stats { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  /* Wochenleiste */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .week .d { text-align: center; font-size: 11px; color: var(--muted); }
  .week .box { margin: 4px auto 0; width: 100%; aspect-ratio: 1; max-width: 40px; border-radius: 9px; border: 2px solid var(--border); background: var(--surface);
    display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--text); }
  .week .box.full { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .week .box.part { border-color: var(--accent); }
  .week .box.today { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Aufgabenliste */
  .tasks { display: flex; flex-direction: column; gap: 8px; }
  .task { display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; padding: 6px 6px 6px 14px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); transition: border-color .15s, opacity .15s; min-height: 64px; }
  .task-main { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; text-align: left; padding: 8px 0; }
  .kg-in { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: none; }
  .kg-in .num-in { width: 76px; padding: 8px; }
  .kg-in small { color: var(--muted); font-size: 12px; }
  .mini.on { color: var(--accent-text); }
  .mini.more { width: 36px; height: 40px; }
  .check-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); font-weight: 600; font-size: 14px; }
  .check-row span:last-child { display: flex; flex-direction: column; gap: 2px; }
  .check-row small { font-weight: 500; font-size: 12px; color: var(--muted); }
  .check-row.on .box-check { background: var(--accent); border-color: var(--accent-edge, var(--accent)); }
  .check-row.on .box-check svg { opacity: 1; transform: scale(1); }
  .menu { display: flex; flex-direction: column; gap: 6px; }
  .menu button { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; }
  .menu button svg { flex: none; color: var(--accent-text); }
  .menu button span { display: flex; flex-direction: column; gap: 2px; }
  .menu button small { font-weight: 500; font-size: 12px; color: var(--muted); }
  .menu button.danger, .menu button.danger svg { color: var(--danger); }
  .task .t { font-weight: 600; }
  .task .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .task.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
  .box-check { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; transition: all .15s; }
  .box-check svg { width: 18px; height: 18px; opacity: 0; transform: scale(.6); transition: all .15s; }
  .done .box-check { background: var(--accent); border-color: var(--accent-edge, var(--accent)); }
  .done .box-check svg { opacity: 1; transform: scale(1); }

  /* Kalender */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head b { font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .wd { height: 22px; text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .cal .c { height: 46px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); display: grid; place-items: center;
    font-size: 14px; font-weight: 600; position: relative; }
  .cal .c.empty { visibility: hidden; }
  .cal .c.full { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .cal .c.part { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
  .cal .c.future { opacity: .35; }
  .cal .c.today { outline: 2px solid var(--text); outline-offset: 2px; }
  .cal .c.sel { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
  .cal .c .bar { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .cal .c .bar i { display: block; height: 100%; background: var(--accent); }
  .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--border); display: inline-block; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .kpi b { font-size: 22px; font-weight: 800; display: block; }
  .kpi span { font-size: 12px; color: var(--muted); }

  /* Training */
  .datebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .datebar .mid { text-align: center; }
  .select { width: 100%; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .ex { margin-top: 10px; }
  .ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ex-head .n { font-weight: 700; font-size: 16px; }
  .ex-head .last { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .sets { margin-top: 12px; display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 32px; gap: 8px; align-items: center; }
  .sets .h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .sets .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
  .sets .pace-row { grid-column: 2 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
  .sets .pace-row:empty { display: none; }
  .modes { margin-top: 10px; }
  .modes .chip { font-size: 12px; padding: 4px 10px; }
  .num-in { width: 100%; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); text-align: center; font-weight: 600; }

  /* Leistung / Diagramme */

  .switch button.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 1px var(--accent-edge, var(--accent)) inset; }

  .ach { padding: 14px; }

    background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 12%, var(--surface)) 0%, var(--surface) 55%); }

  .ach-info { margin-top: 8px; }

  .recs { display: flex; flex-direction: column; gap: 10px; }
  .cal-sum { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 14px; padding: 12px 14px;
    border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); font-size: 14px; }

  /* Bestleistung-Feier */
  .pr-banner { position: fixed; z-index: 90; left: 50%; top: calc(14px + env(safe-area-inset-top)); width: min(420px, calc(100vw - 24px));
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 14px 40px rgba(0,0,0,.35); transform: translate(-50%, -160%); animation: prIn .6s cubic-bezier(.2,1.4,.4,1) forwards; }

  @keyframes prIn { to { transform: translate(-50%, 0); } }
  @keyframes prOut { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -160%); opacity: 0; } }
  @keyframes trophy { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-14deg) scale(1.2); } 75% { transform: rotate(14deg) scale(1.2); } }

  /* Übungen verschieben */

};

function woComplete(w) {
  if (!w) return false;
  const pl = planByName(w.plan), type = pl?.type || ((w.exercises || []).length ? "gym" : null);
  if (type === "run") return numv(w.run?.km) > 0 && parseDur(w.run?.minutes) > 0;
  if (type === "session") return numv(w.session?.minutes) > 0;
  const ex = (w.exercises || []).filter(e => exMode(e) !== "cardio" || (e.sets || []).length);
  return ex.length > 0 && ex.every(e => (e.sets || []).length > 0 && e.sets.every(setFilled));

// Hakt die Trainings-Aufgabe automatisch ab, sobald das Training vollständig eingetragen ist
async function syncTrainTask(k, w) {
  const key = trainKey(), tasks = tasksFor(fromKey(k));
  if (!tasks.some(t => t.key === key)) return;
  if (!S.days[k]) { try { const d = await getDoc(dayRef(k)); if (d.exists()) S.days[k] = d.data(); } catch { return; } }
  const cur = S.days[k] || { done: {} }, full = woComplete(w), isDone = !!cur.done?.[key];
  let val = null;
  if (full && !isDone) val = true;
  else if (!full && isDone && cur.autoTrain) val = false;   // nur zurücknehmen, wenn es automatisch gesetzt wurde
  if (val === null) return;
  const done = { ...(cur.done || {}), [key]: val }, count = tasks.filter(t => done[t.key]).length;
  const data = { ...cur, date: k, done, weight: cur.weight || {}, count, total: tasks.length, complete: count === tasks.length, autoTrain: val };
  S.days[k] = data;
  if (val) { if (data.complete && !cur.complete) quotaDone(); else toast("Training vollständig – Aufgabe abgehakt ✓"); }
  if (S.tab === "start") renderStart();
  try { await setDoc(dayRef(k), data); } catch {}
}
async function setWeight(k, key, slot, raw) {
  const v = String(raw).trim().replace(",", ".");
  const num = v === "" ? "" : parseFloat(v);
  if (v !== "" && (isNaN(num) || num < 20 || num > 400)) { toast("Bitte ein gültiges Gewicht eingeben"); return; }
  const tasks = tasksFor(fromKey(k));
  const cur = S.days[k] || { done: {} };
  const done = { ...(cur.done || {}) }, weight = { ...(cur.weight || {}) };
  if (num === "") { delete weight[slot]; done[key] = false; } else { weight[slot] = num; done[key] = true; }
  const count = tasks.filter(t => done[t.key]).length;
  const data = { date: k, done, weight, count, total: tasks.length, complete: count === tasks.length };
  S.days[k] = data;
  renderStart(); if (S.tab === "cal") renderCal();
  if (data.complete && !cur.complete) quotaDone();
  try { await setDoc(dayRef(k), data); } catch { toast("Speichern fehlgeschlagen – bist du offline?"); }
}
const dayInfo = k => {
  const d = S.days[k];
  const total = d?.total ?? tasksFor(fromKey(k)).length;

};
function streak() {
  let k = todayKey(), n = 0;
  if (!dayInfo(k).complete) k = keyOf(addDays(fromKey(k), -1));
  while (dayInfo(k).complete) { n++; k = keyOf(addDays(fromKey(k), -1)); }
  return n;
}

const numv = x => { const v = parseFloat(String(x ?? "").replace(",", ".")); return isNaN(v) ? 0 : v; };

  return Math.max(0, ...(e.sets || []).map(setScore)); };
const exWeighted = e => exMode(e) === "weight" && (e.sets || []).some(x => numv(x.kg) > 0 && numv(x.reps) > 0);
const exVolume = e => exMode(e) === "weight" ? (e.sets || []).reduce((a, x) => a + numv(x.kg) * numv(x.reps), 0) : 0;
const exSets = e => (e.sets || []).filter(x => numv(x.reps) > 0 || numv(x.km) > 0 || numv(x.sec) > 0).length;

function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / (n - 1), mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

  const pts = series.flatMap(s => s.pts);

  const W = 340, H = height, L = 36, Rm = 12, T = 14, B = 22;
  const xs = pts.map(p => fromKey(p.x).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = pts.map(p => p.y), ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = k => x1 === x0 ? L + (W - L - Rm) / 2 : L + (fromKey(k).getTime() - x0) / (x1 - x0) * (W - L - Rm);
  const Y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  let g = ticks.map(t => `<line x1="${L}" x2="${W - Rm}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${L - 6}" y="${Y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(t, 1)}</text>`).join("");
  const xl = [...new Set(pts.map(p => p.x))].sort();
  const lab = xl.length > 1 ? [xl[0], xl[xl.length - 1]] : xl;
  g += lab.map((k, i) => `<text x="${X(k)}" y="${H - 6}" text-anchor="${lab.length > 1 ? (i ? "end" : "start") : "middle"}" font-size="10" fill="var(--muted)">${dShort(k)}</text>`).join("");
  for (const s of series) {
    const sp = [...s.pts].sort((a, b) => a.x.localeCompare(b.x));
    if (sp.length > 1) g += `<path d="${sp.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    const dense = sp.length > 20;
    g += sp.map((p, i) => dense && i < sp.length - 1 ? "" : `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const last = sp[sp.length - 1];
    if (s.label !== false) g += `<text x="${Math.min(X(last.x), W - Rm)}" y="${Y(last.y) - 9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--text)">${fmtN(last.y, dec)}${unit}</text>`;
    g += sp.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="13" fill="transparent" data-tip="${esc(p.tip || `${dShort(p.x)}: ${fmtN(p.y, dec)}${unit}`)}" data-px="${X(p.x) / W * 100}" data-py="${Y(p.y) / H * 100}"/>`).join("");
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
function barChart(items, { unit = "", dec = 0, height = 150 } = {}) {
  if (!items.length) return "";
  const W = 340, H = height, L = 8, Rm = 8, T = 18, B = 22;
  const max = Math.max(1, ...items.map(i => i.y)), n = items.length;
  const slot = (W - L - Rm) / n, bw = Math.min(34, slot * .62);
  let g = `<line x1="${L}" x2="${W - Rm}" y1="${H - B}" y2="${H - B}" stroke="var(--border)"/>`;
  items.forEach((it, i) => {
    const cx = L + slot * (i + .5), h = (it.y / max) * (H - T - B), y = H - B - h;
    if (it.y > 0) {
      const r = Math.min(4, h, bw / 2);
      g += `<path d="M${cx - bw / 2},${H - B} V${y + r} Q${cx - bw / 2},${y} ${cx - bw / 2 + r},${y} H${cx + bw / 2 - r} Q${cx + bw / 2},${y} ${cx + bw / 2},${y + r} V${H - B} Z" fill="${it.dim ? "color-mix(in srgb, var(--accent) 35%, var(--surface-2))" : "var(--accent)"}"/>`;
      if (it.showVal) g += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${fmtN(it.y, dec)}${unit}</text>`;
    }
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="10" fill="${it.hl ? "var(--text)" : "var(--muted)"}" font-weight="${it.hl ? 700 : 400}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - slot / 2}" y="${T - 10}" width="${slot}" height="${H - T - B + 10}" fill="transparent" data-tip="${esc(it.tip || `${it.label}: ${fmtN(it.y, dec)}${unit}`)}" data-px="${cx / W * 100}" data-py="${Math.max(y, T) / H * 100}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
const deltaTxt = (a, b, unit = "%", dec = 1) => {
  if (b == null || !isFinite(a) || !isFinite(b)) return "";
  const d = unit === "%" ? (b ? (a - b) / b * 100 : 0) : a - b;
  const arrow = d > 0.05 ? "▲" : d < -0.05 ? "▼" : "■";
  return `<span class="delta">${arrow} ${d > 0 ? "+" : ""}${fmtN(d, dec)}${unit === "%" ? " %" : " " + unit}</span>`;
};

function renderPerf() {
  const v = $("#view-perf"); if (!v) return;
  const all = S.allWo, from = rangeStart();
  const chip = (attr, val, cur, l) => `<button class="chip ${cur === val ? "accent" : ""}" data-action="${attr}" data-v="${esc(val)}">${esc(l)}</button>`;
  const rng = S.perfRange || "3m";
  const view = S.perfView || "rank";
  const TITLES = { stats: "Deine Entwicklung", rank: "Dein Rang", awards: "Deine Erfolge", records: "Deine Bestwerte" };
  const pb = (v, l) => `<button class="${view === v ? "on" : ""}" data-action="pview" data-v="${v}">${l}</button>`;
  let html = `<header class="top"><div><div class="eyebrow">Leistung</div><h1>${TITLES[view] || TITLES.stats}</h1></div></header>
    <div class="switch four">${pb("rank", "⚡<span>Rang</span>")}${pb("awards", "🏅<span>Erfolge</span>")}${pb("records", "🏆<span>Bestwerte</span>")}${pb("stats", "📈<span>Auswertung</span>")}</div>`;
  if (!all) { v.innerHTML = html + `<div class="card empty perf-card">Lade Daten …</div>`; return; }
  if (view === "rank") { v.innerHTML = html + rankCard(); return; }
  if (view === "awards") { v.innerHTML = html + renderAwards(all, "awards"); return; }
  if (view === "records") { v.innerHTML = html + renderAwards(all, "records"); return; }
  html += `<div class="seg" style="margin-top:12px">${chip("prange", "4w", rng, "4 Wochen")}${chip("prange", "3m", rng, "3 Monate")}${chip("prange", "6m", rng, "6 Monate")}${chip("prange", "all", rng, "Alles")}</div>`;

  /* --- 1. Kraft-Index pro Trainingsart --- */
  const gymTypes = ["Push", "Pull", "Ergänzungstraining", "Calisthenics"];
  const base = {};   // erster Wert jeder Übung = 100 %
  for (const w of all) for (const e of w.exercises || []) { const b = exBest(e); if (b > 0 && !(e.name in base)) base[e.name] = b; }
  const sessions = all.filter(w => gymTypes.includes(w.plan)).map(w => {
    const rel = (w.exercises || []).map(e => ({ e, b: exBest(e) })).filter(x => x.b > 0 && base[x.e.name]).map(x => x.b / base[x.e.name] * 100);
    return { date: w.date, plan: w.plan, idx: rel.length ? rel.reduce((a, b) => a + b, 0) / rel.length : null,
      vol: (w.exercises || []).reduce((a, e) => a + exVolume(e), 0), sets: (w.exercises || []).reduce((a, e) => a + exSets(e), 0), n: rel.length };
  }).filter(x => x.idx != null);
  const typesWithData = gymTypes.filter(t => sessions.some(x => x.plan === t));
  if (!S.perfType || !typesWithData.includes(S.perfType)) S.perfType = typesWithData[typesWithData.length - 1] || "Push";
  const ts = sessions.filter(x => x.plan === S.perfType && x.date >= from);
  html += `<div class="card perf-card">
    <div class="seg">${(typesWithData.length ? typesWithData : gymTypes).map(t => chip("ptype", t, S.perfType, t === "Ergänzungstraining" ? "Ergänzung" : t)).join("")}</div>`;
  if (ts.length) {
    const last = ts[ts.length - 1], prev = ts[ts.length - 2], first = ts[0];
    html += `<div class="perf-head" style="margin-top:14px"><div><div class="k">Kraft-Index ${esc(S.perfType)}</div><div class="v">${fmtN(last.idx, 0)}</div>
        <div class="d">${prev ? `${deltaTxt(last.idx, prev.idx)} zum letzten Mal` : "Erstes Training im Zeitraum"}</div></div>
      <div style="text-align:right"><div class="k">seit ${dShort(first.date)}</div><div class="d" style="margin-top:6px">${ts.length > 1 ? deltaTxt(last.idx, first.idx) : "–"}</div></div></div>
      ${lineChart([{ color: "var(--accent)", pts: ts.map(x => ({ x: x.date, y: x.idx, tip: `${dShort(x.date)}: Index ${fmtN(x.idx, 0)} · ${x.sets} Sätze · ${fmtN(x.vol, 0)} kg bewegt` })) }], { dec: 0 })}
      <div class="note">100 = deine erste Einheit je Übung. Der Index vergleicht den besten Satz jeder Übung mit deinem Start (geschätztes Maximalgewicht aus Gewicht × Wiederholungen, ohne Gewicht zählen die Wiederholungen).</div>`;
  } else html += `<div class="empty">Noch keine Daten für ${esc(S.perfType)} in diesem Zeitraum.<br>Trag im Training Gewicht und Wiederholungen ein.</div>`;
  html += `</div>`;

  /* --- 2. Woche Mo–So --- */
  const off = S.perfWeek || 0, today = new Date();
  const monday = addDays(today, -((today.getDay() + 6) % 7) + off * 7);
  const wk = [...Array(7)].map((_, i) => {
    const d = addDays(monday, i), k = keyOf(d), w = all.find(x => x.date === k);
    const sets = w ? (w.exercises || []).reduce((a, e) => a + exSets(e), 0) : 0;
    const vol = w ? (w.exercises || []).reduce((a, e) => a + exVolume(e), 0) : 0;
    const extra = w?.run?.km ? ` · ${w.run.km} km` : w?.session?.minutes ? ` · ${w.session.minutes} min` : "";
    return { label: WD[d.getDay()], y: sets, hl: k === todayKey(), showVal: sets > 0,
      tip: w ? `${WD[d.getDay()]} ${dShort(k)} · ${w.plan}: ${sets} Sätze${vol ? ` · ${fmtN(vol, 0)} kg` : ""}${extra}` : `${WD[d.getDay()]} ${dShort(k)}: kein Eintrag`, w };
  });
  const wSets = wk.reduce((a, x) => a + x.y, 0), wDays = wk.filter(x => x.w && hasContent(x.w)).length;
  html += `<div class="card perf-card">
    <div class="perf-head"><div><div class="k">${off === 0 ? "Diese Woche" : off === -1 ? "Letzte Woche" : `Woche ab ${dShort(keyOf(monday))}`}</div>
      <div class="v">${wSets} <span style="font-size:15px;font-weight:600;color:var(--muted)">Sätze</span></div><div class="d">${wDays} Trainingstag${wDays === 1 ? "" : "e"}</div></div>
      <div style="display:flex;gap:6px"><button class="icon-btn" data-action="pweek" data-v="-1">${ICON.left}</button><button class="icon-btn" data-action="pweek" data-v="1" ${off >= 0 ? "disabled style='opacity:.35'" : ""}>${ICON.right}</button></div></div>
    ${barChart(wk)}
    <div class="note">Tipp auf einen Tag für Details (Training, Sätze, bewegtes Gewicht).</div></div>`;

  /* --- 3. Übung im Detail --- */
  const exNames = [...new Set(all.flatMap(w => (w.exercises || []).filter(e => exBest(e) > 0).map(e => e.name)))].sort((a, b) => a.localeCompare(b, "de"));
  if (exNames.length) {
    if (!S.perfEx || !exNames.includes(S.perfEx)) {
      const lastW = [...all].reverse().find(w => (w.exercises || []).some(e => exBest(e) > 0));
      S.perfEx = lastW.exercises.find(e => exBest(e) > 0).name;
    }
    const hist = all.filter(w => w.date >= from).map(w => ({ w, e: (w.exercises || []).find(e => e.name === S.perfEx) })).filter(x => x.e && exBest(x.e) > 0);
    const weighted = hist.some(x => exWeighted(x.e));
    const dm = hist.length ? exMode(hist[hist.length - 1].e) : "weight", isTime = dm === "time";
    const unitD = weighted ? " kg" : isTime ? " s" : "";
    const pts = hist.map(x => {
      const top = [...(x.e.sets || [])].sort((a, b) => (exMode(x.e) === "time" ? numv(b.sec) - numv(a.sec) : setScore(b) - setScore(a)))[0];
      return { x: x.w.date, y: exBest(x.e), tip: `${dShort(x.w.date)}: ${setTxt(top, exMode(x.e))}${exMode(x.e) === "band" ? " Wdh." : ""}${weighted ? ` ≈ ${fmtN(exBest(x.e), 1)} kg max` : ""}` };
    });
    const best = pts.length ? Math.max(...pts.map(p => p.y)) : 0, lastP = pts[pts.length - 1], prevP = pts[pts.length - 2];
    html += `<div class="card perf-card">
      <div class="field" style="margin-top:0"><label>Übung im Detail</label>
        <select class="select" data-action="pex">${exNames.map(n => `<option ${n === S.perfEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>`;
    if (pts.length) {
      html += `<div class="perf-head" style="margin-top:14px"><div><div class="k">${weighted ? "Geschätztes Maximalgewicht" : isTime ? "Längste Zeit" : "Beste Wiederholungen"}</div>
          <div class="v">${fmtN(lastP.y, weighted ? 1 : 0)}${unitD}</div>
          <div class="d">${prevP ? `${deltaTxt(lastP.y, prevP.y, weighted ? "kg" : isTime ? "s" : "Wdh.", weighted ? 1 : 0)} zum letzten Mal` : "Erster Eintrag im Zeitraum"}</div></div>
        <div style="text-align:right"><div class="k">Rekord</div><div class="v" style="font-size:20px">${fmtN(best, weighted ? 1 : 0)}${unitD}</div>${lastP.y >= best && pts.length > 1 ? `<div class="d">🏆 neuer Rekord</div>` : ""}</div></div>
        ${lineChart([{ color: "var(--accent)", pts }], { unit: unitD, dec: weighted ? 1 : 0 })}`;
    } else html += `<div class="empty">Keine Einträge für diese Übung im Zeitraum.</div>`;
    html += `</div>`;
  }

  /* --- 4. Körpergewicht --- */
  const wDaysAll = Object.values(S.days).filter(d => d.weight && (d.weight.am || d.weight.pm) && d.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  html += `<div class="card perf-card">`;
  if (wDaysAll.length) {
    const am = wDaysAll.filter(d => d.weight.am).map(d => ({ x: d.date, y: numv(d.weight.am) }));
    const pm = wDaysAll.filter(d => d.weight.pm).map(d => ({ x: d.date, y: numv(d.weight.pm) }));
    const main = am.length ? am : pm, lastW = main[main.length - 1];
    const weekAgo = keyOf(addDays(fromKey(lastW.x), -7));
    const ref = [...main].reverse().find(p => p.x <= weekAgo);
    const last7 = main.filter(p => p.x > keyOf(addDays(new Date(), -7)));
    html += `<div class="perf-head"><div><div class="k">Körpergewicht ${am.length ? "morgens" : "abends"}</div><div class="v">${fmtN(lastW.y, 1)} kg</div>
        <div class="d">${ref ? `${deltaTxt(lastW.y, ref.y, "kg", 1)} in 7 Tagen` : "Noch keine Woche Daten"}</div></div>
      <div style="text-align:right"><div class="k">Ø 7 Tage</div><div class="v" style="font-size:20px">${last7.length ? fmtN(last7.reduce((a, p) => a + p.y, 0) / last7.length, 1) + " kg" : "–"}</div></div></div>
      ${lineChart([{ name: "Morgens", color: "var(--accent)", pts: am.map(p => ({ ...p, tip: `${dShort(p.x)} morgens: ${fmtN(p.y, 1)} kg` })) },
                   { name: "Abends", color: "var(--muted)", dash: true, label: false, pts: pm.map(p => ({ ...p, tip: `${dShort(p.x)} abends: ${fmtN(p.y, 1)} kg` })) }].filter(x => x.pts.length), { unit: " kg", dec: 1 })}
      ${am.length && pm.length ? `<div class="legend2"><span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="var(--accent)" stroke-width="2"/></svg>Morgens</span>
        <span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/></svg>Abends</span></div>` : ""}`;
  } else html += `<div class="k" style="font-size:13px;color:var(--muted);font-weight:600">Körpergewicht</div><div class="empty">Trag auf der Startseite dein Gewicht morgens und abends ein, dann siehst du hier den Verlauf.</div>`;
  html += `</div>`;

  /* --- 5. Laufen --- */
  const runs = cardioEntries(all).filter(r => r.date >= from);
  if (runs.length) {
    const km = runs.reduce((a, r) => a + r.km, 0);
    const paces = runs.filter(r => r.min > 0).map(r => r.min / r.km);
    const bestPace = paces.length ? Math.min(...paces) : null;
    const pf = p => paceOf(1, p);
    // pro Tag zusammenfassen
    const byDay = {}; for (const r of runs) { const d = (byDay[r.date] ||= { km: 0, min: 0, names: [] }); d.km += r.km; d.min += r.min; d.names.push(r.name); }
    const days = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0])).slice(-10);
    html += `<div class="card perf-card"><div class="perf-head"><div><div class="k">Ausdauer</div><div class="v">${fmtN(km, 1)} km</div><div class="d">${runs.length} Einheiten im Zeitraum</div></div>
      <div style="text-align:right"><div class="k">Beste Pace</div><div class="v" style="font-size:20px">${bestPace ? pf(bestPace) : "–"}</div><div class="d">min/km</div></div></div>
      ${barChart(days.map(([k, d]) => ({ label: dShort(k), y: d.km, showVal: true,
        tip: `${dShort(k)}: ${fmtN(d.km, 1)} km${d.min ? ` in ${paceOf(1, d.min)} min (${pf(d.min / d.km)} min/km)` : ""} · ${[...new Set(d.names)].join(", ")}` })), { dec: 1 })}</div>`;
  }

  /* --- 6. Konsistenz: Quote pro Woche --- */
  const weeks = [...Array(8)].map((_, i) => {
    const mon = addDays(today, -((today.getDay() + 6) % 7) - (7 - i) * 7);
    let full = 0, cnt = 0;
    for (let j = 0; j < 7; j++) { const k = keyOf(addDays(mon, j)); if (k > todayKey()) continue; cnt++; if (dayInfo(k).complete) full++; }
    return { label: dShort(keyOf(mon)), y: cnt ? Math.round(full / cnt * 100) : 0, showVal: true, hl: i === 7, dim: i === 7,
      tip: `Woche ab ${dShort(keyOf(mon))}: ${full} von ${cnt} Tagen erfüllt` };
  });
  html += `<div class="card perf-card"><div class="perf-head"><div><div class="k">Konsistenz</div><div class="v">${weeks[6].y} %</div>
      <div class="d">Tagesquote letzte Woche ${deltaTxt(weeks[6].y, weeks[5].y, "Pkt.", 0)}</div></div></div>
    ${barChart(weeks, { unit: "%" })}<div class="note">Anteil der Tage pro Woche, an denen alle täglichen Aufgaben erledigt waren. Die laufende Woche ist heller.</div></div>`;

  v.innerHTML = html;
}

async function saveTypeForm() {

async function deleteType(i) {

/* ===================== ÜBUNGEN PER DRAG & DROP SORTIEREN ===================== */
let pend = null, drag = null;
document.addEventListener("pointerdown", e => {
  const card = e.target.closest("#exList .ex[data-ex]"); if (!card || drag) return;
  if (e.target.closest("input, textarea, button, select")) return;
  const HOLD = 1500;   // so lange gedrückt halten (ms), bis die Übung verschoben werden kann
  pend = { card, x: e.clientX, y: e.clientY,
    h: setTimeout(() => card.classList.add("holding"), 250),
    t: setTimeout(() => { if (pend) { const p = pend; pend = null; p.card.classList.remove("holding"); startDrag(p.card, p.y); } }, HOLD) };
});
document.addEventListener("pointermove", e => {
  if (pend && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) > 10) cancelPend();
  if (drag) moveDrag(e.clientY);
});
function cancelPend() { if (!pend) return; clearTimeout(pend.t); clearTimeout(pend.h); pend.card.classList.remove("holding"); pend = null; }
const endPointer = () => { cancelPend(); if (drag) endDrag(); };
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", endPointer);
document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", e => { if (e.target.closest("#exList .ex")) e.preventDefault(); });

function startDrag(card, y) {
  const list = $("#exList"); if (!list) return;
  // Alle Übungen kompakt anzeigen, damit man nicht weit ziehen muss; Liste bleibt unter dem Finger
  const before = card.getBoundingClientRect().top;
  list.classList.add("compact");
  const after = card.getBoundingClientRect().top;
  scrollBy(0, after - y + 28);   // Kopf der Übung wieder unter den Finger holen
  const r = card.getBoundingClientRect();
  const ph = document.createElement("div"); ph.className = "ex-ph"; ph.style.height = r.height + "px";
  card.parentNode.insertBefore(ph, card);
  card.classList.add("dragging");
  const off = Math.min(28, r.height / 2);   // Karte sitzt immer direkt unter dem Finger
  Object.assign(card.style, { left: r.left + "px", top: (y - off) + "px", width: r.width + "px" });
  document.body.classList.add("drag-on");
  drag = { card, ph, list, off, y, h: r.height };
  moveDrag(y);
  try { navigator.vibrate?.(25); } catch {}
  drag.tick = setInterval(() => {   // automatisch scrollen am Bildschirmrand
    if (!drag) return;
    const edge = 90, h = innerHeight - 70;
    if (drag.y < edge) { scrollBy(0, -10); moveDrag(drag.y); }
    else if (drag.y > h - edge) { scrollBy(0, 10); moveDrag(drag.y); }
  }, 16);
}
function moveDrag(y) {
  const d = drag; d.y = y;
  d.card.style.top = (y - d.off) + "px";
  const others = [...d.list.querySelectorAll(".ex[data-ex]")].filter(c => c !== d.card);
  const cy = y - d.off + d.h / 2;   // Mitte der gezogenen Übung
  const before = others.find(c => { const r = c.getBoundingClientRect(); return cy < r.top + r.height / 2; });
  if (before) { if (d.ph.nextSibling !== before) d.list.insertBefore(d.ph, before); }
  else if (d.ph !== d.list.lastElementChild) d.list.appendChild(d.ph);
}
function endDrag() {
  const d = drag; drag = null; clearInterval(d.tick);
  document.body.classList.remove("drag-on");
  d.list.classList.remove("compact");
  const order = [...d.list.children].map(el => el === d.ph ? +d.card.dataset.ex : el.classList.contains("ex") && el !== d.card ? +el.dataset.ex : null).filter(x => x !== null);
  const old = S.workout.exercises, changed = order.some((v, i) => v !== i);
  if (changed) { S.workout.exercises = order.map(i => old[i]); saveWorkout(true); }
  else renderTrain();
}

async function renameExercise(i) {

  let found = false;

// Rekordwert einer Übung je nach Messart (höher = besser)
function prValue(e) {
  const m = exMode(e), sets = e.sets || [];
  if (m === "cardio") return Math.max(0, ...sets.map(x => numv(x.km)));
  if (m === "time") return Math.max(0, ...sets.map(x => numv(x.sec)));
  if (m === "weight") return Math.max(0, ...sets.map(setScore));
  return Math.max(0, ...sets.map(x => numv(x.reps)));
}
function prText(e) {
  const m = exMode(e), sets = (e.sets || []).filter(setFilled);
  if (!sets.length) return "";
  const best = [...sets].sort((a, b) => prValue({ ...e, sets: [b] }) - prValue({ ...e, sets: [a] }))[0];
  return setTxt(best, m) + (m === "band" || m === "reps" ? (m === "band" ? " Wdh." : "") : "");
}
// Bester bisheriger Wert vor einem Datum (gleiche Übung, gleiche Messart)
function bestBefore(name, mode, date) {
  let best = 0;
  for (const w of S.allWo || []) {
    if (w.date >= date) continue;
    for (const e of w.exercises || []) if (e.name === name && exMode(e) === mode) best = Math.max(best, prValue(e));
  }
  return best;
}
function checkPR(i) {
  const e = S.workout?.exercises?.[i]; if (!e || !S.allWo) return;
  const cur = prValue(e), prev = bestBefore(e.name, exMode(e), S.trainDate);
  const tag = e.name + "|" + exMode(e);
  if (prev > 0 && cur > prev && !(S.workout.prs || []).includes(tag)) {
    (S.workout.prs ||= []).push(tag);
    celebrate("Neue Bestleistung!", `${e.name}: ${prText(e)}`);
    saveWorkout();
  }
}

// Jeden Tag gibt es Rang-Punkte (RP) für deine Quote, dein Training und Bestleistungen.
// Jeder Rang kostet pro Tag RP – je höher, desto teurer. Wer nicht dranbleibt, rutscht Stufe für Stufe ab.
const RANKS = [
  { n: "Bronze",      min: 0,    cost: 4,    c: "#CD7F32", i: "🥉" },
  { n: "Silber",      min: 60,   cost: 6,    c: "#B8BCC6", i: "🥈" },
  { n: "Gold",        min: 150,  cost: 8,    c: "#FFC400", i: "🥇" },
  { n: "Platin",      min: 300,  cost: 9,    c: "#7FD1C7", i: "💠" },
  { n: "Diamant",     min: 550,  cost: 10,   c: "#7EC8FF", i: "💎" },
  { n: "Meister",     min: 900,  cost: 11,   c: "#2EE59D", i: "🎖️" },
  { n: "Großmeister", min: 1400, cost: 11.5, c: "#FF5E57", i: "🏵️" },
  { n: "Champion",    min: 2100, cost: 12,   c: "#FF8A00", i: "🏆" },
  { n: "Legende",     min: 3000, cost: 12.5, c: "#FFD84D", i: "🌟" },
  { n: "Mythos",      min: 4200, cost: 13,   c: "#C04DFF", i: "🔮" },
  { n: "GOD-LEVEL",   min: 6000, cost: 13.5, c: "#FFFFFF", i: "⚡", god: true },
];
const GAIN = { quota: 12, train: 5, pr: 3 };   // max. 20 RP pro Tag
const rankOf = rp => { let t = 0; RANKS.forEach((r, i) => { if (rp >= r.min) t = i; }); return t; };
function dayGain(k, woByDate) {
  const inf = dayInfo(k), w = woByDate[k];
  const quota = inf.total ? GAIN.quota * Math.min(1, inf.count / inf.total) : 0;
  const rest = planFor(fromKey(k).getDay()).type === "rest";
  const train = rest || S.days[k]?.done?.[trainKey()] || woComplete(w) ? GAIN.train : 0;   // nur vollständige Trainings zählen
  const pr = w?.prs?.length ? GAIN.pr : 0;
  return { quota, train, pr, rest, total: quota + train + pr };
}
function rankState() {
  const all = S.allWo || [], woByDate = Object.fromEntries(all.map(w => [w.date, w]));
  const tk = todayKey();
  const firsts = [Object.keys(S.days).filter(k => (S.days[k]?.count || 0) > 0).sort()[0], all.find(w => hasContent(w))?.date].filter(Boolean).sort();
  let rp = 0, peak = 0; const hist = [];
  if (firsts.length) {
    for (let d = fromKey(firsts[0]); keyOf(d) <= tk; d = addDays(d, 1)) {
      const k = keyOf(d), tier = rankOf(rp), g = dayGain(k, woByDate);
      rp += g.total;
      if (k < tk) rp = Math.max(0, rp - RANKS[tier].cost);   // heutige Kosten erst um Mitternacht
      peak = Math.max(peak, rankOf(rp));
      hist.push({ x: k, y: rp });
    }
  }
  const tier = rankOf(rp), today = dayGain(tk, woByDate);
  return { rp, tier, peak, hist, today, cost: RANKS[tier].cost, next: RANKS[tier + 1] || null };
}

}

    <div class="two" style="margin-top:16px"><button class="btn" data-action="cpcancel">Abbrechen</button><button class="btn primary" data-action="cpsave">Übernehmen</button></div>`;
  showSheet(true);
  cpRender(true);
  const drag = (el, fn) => {
    el.onpointerdown = e => { e.preventDefault(); el.setPointerCapture(e.pointerId); fn(e); el.onpointermove = fn; };
    el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };
  };
  drag($("#cpSV"), e => { const r = $("#cpSV").getBoundingClientRect();
    S.cp.hsv[1] = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); S.cp.hsv[2] = 1 - Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); cpRender(true); });
  drag($("#cpHue"), e => { const r = $("#cpHue").getBoundingClientRect();
    S.cp.hsv[0] = Math.max(0, Math.min(359.9, (e.clientX - r.left) / r.width * 360)); cpRender(true); });
}
// Anzeige aktualisieren; fields=false lässt das gerade bearbeitete Feld in Ruhe
function cpRender(fields, skip) {
  const [h, sat, v] = S.cp.hsv, rgb = hsv2rgb(h, sat, v), hex = rgb2hex(...rgb);
  S.cp.hex = hex;
  $("#cpSV").style.background = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(${h}, 100%, 50%))`;
  Object.assign($("#cpDot").style, { left: sat * 100 + "%", top: (1 - v) * 100 + "%", background: hex });
  Object.assign($("#cpThumb").style, { left: h / 360 * 100 + "%", background: `hsl(${h}, 100%, 50%)` });
  $("#cpNew").style.background = hex;
  if (fields !== false) {
    if (skip !== "hex") $("#cpHex").value = hex.slice(1);
    rgb.forEach((c, i) => { const id = "cp" + "RGB"[i]; if (skip !== id) $("#" + id).value = Math.round(c); });
  }
  window.applyTheme({ ...curTheme(), accent: hex });   // Live-Vorschau in der ganzen App
}
function cpFromInput(t) {
  if (t.id === "cpHex") {

  } else {

  }
}
function cpClose(save) {

  else if (a === "delex") { closeSheet(); if (await askYesNo(`„${w.exercises[el.dataset.i].name}“ aus dem heutigen Training entfernen?`)) { w.exercises.splice(el.dataset.i, 1); saveWorkout(true); } }
  else if (a === "addset") {
    const ex = w.exercises[el.dataset.i], mode = exMode(ex), last = ex.sets[ex.sets.length - 1] || {}, ns = emptySet(mode);
    if (mode === "weight") ns.kg = last.kg || ""; if (mode === "band") ns.band = last.band || "";
    ex.sets.push(ns); saveWorkout(true);
  }
  else if (a === "exmode") {
    const ex = w.exercises[el.dataset.i], mode = el.dataset.v; if (exMode(ex) === mode) return;
    ex.mode = mode;
    ex.sets = ex.sets.map(st => ({ ...emptySet(mode), ...(st.reps !== undefined && mode !== "cardio" ? { reps: st.reps } : {}) }));
    (S.exModes ||= {})[ex.name] = mode;
    setDoc(userRef(), { exModes: S.exModes }, { merge: true }).catch(() => {});
    saveWorkout(true);
  }
  else if (a === "delset") { w.exercises[el.dataset.i].sets.splice(el.dataset.j, 1); saveWorkout(true); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.action === "pex") { S.perfEx = e.target.value; renderPerf(); }

  if (e.target.dataset.dur !== undefined && /^\d{1,2}$/.test(e.target.value)) {   // „25“ → „25:00“
    e.target.value += ":00"; const ev = new Event("input", { bubbles: true }); ev.isNormalise = true; e.target.dispatchEvent(ev);
  }
  if (e.target.dataset.set) checkPR(+e.target.dataset.set.split(".")[0]);
  if (e.target.dataset.weight) setWeight(e.target.dataset.day, e.target.dataset.key, e.target.dataset.weight, e.target.value);
});
document.addEventListener("keydown", e => {
  const ck = e.target.dataset?.ck;
  if (ck !== undefined && e.key === "Backspace" && e.target.value === "" && S.noteItems.length > 1) {   // leeren Punkt löschen
    e.preventDefault(); const i = +ck; S.noteItems.splice(i, 1); const prev = Math.max(0, i - 1); renderCk(S.noteItems[prev] ? prev : null); saveNoteSoon(); return; }
  if (e.key !== "Enter") return;
  if (ck !== undefined) {   // Enter: neuer Punkt darunter (Text hinter dem Cursor wandert mit)
    e.preventDefault(); const i = +ck, el = e.target, p = el.selectionStart ?? el.value.length;
    const rest = el.value.slice(p); S.noteItems[i].t = el.value.slice(0, p);
    S.noteItems.splice(i + 1, 0, { t: rest, d: S.noteItems[i].d }); renderCk(i + 1, 0); saveNoteSoon(); return; }
  if (e.target.id === "todoIn") { e.preventDefault(); addTodo(); }
  if (e.target.id === "customEx") { e.preventDefault(); document.querySelector('[data-action="addcustom"]')?.click(); }
  if (e.target.dataset.weight) { e.preventDefault(); e.target.blur(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.dur !== undefined && !e.isNormalise) { const f = fmtDurTyping(t.value); if (f !== t.value) t.value = f; }
  if (t.id === "cpHex" || t.id === "cpR" || t.id === "cpG" || t.id === "cpB") { cpFromInput(t); return; }
  if (t.id === "noteTitle" || t.id === "noteText") { saveNoteSoon(); return; }
  if (t.dataset.mythcol !== undefined) { const c = mythColorsNow(); c[+t.dataset.mythcol] = t.value; setCosm({ mythColors: c }, false); return; }
  if (t.dataset.ck !== undefined) { S.noteItems[+t.dataset.ck].t = t.value; saveNoteSoon(); return; }
  if (t.id === "noteQ") { S.noteQ = t.value; const pos = t.selectionStart; renderTodo(); const q = $("#noteQ"); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (t.id === "todoIn") { S.todoDraft = t.value; }
  if (t.dataset.set) {
    const [i, j, f] = t.dataset.set.split("."), st = S.workout.exercises[i].sets[j]; st[f] = t.value;
    const pr = $(`#pace-${i}-${j}`);
    if (pr && f === "sec") pr.textContent = numv(st.sec) >= 60 ? "= " + fmtSec(st.sec) : "";
    else if (pr) { const pc = paceOf(st.km, st.min); pr.textContent = pc ? `Pace ${pc} min/km` : ""; }
    saveWorkout();
  }
  else if (t.dataset.in) {
    const [grp, f] = t.dataset.in.split("."); (S.workout[grp] ||= {})[f] = t.value;
    if (grp === "run") { const p = $("#pace"); if (p) p.textContent = paceTxt(S.workout.run); }
    saveWorkout();
  }
});

/* ===================== ERINNERUNG / BENACHRICHTIGUNG ===================== */
// Öffentlicher Web-Push-Schlüssel aus Firebase (Projekteinstellungen → Cloud Messaging → Web-Push-Zertifikate)
const VAPID_KEY = "BObITakMKFitnb_6SsNda__5RGrPi7jsYIiowIHo4o4rJVMvDCtWg6J2WQPVUnyQ9qUr9xtXhyxnP4ktBWmn5DY";
let swReg = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(r => { swReg = r; registerPeriodic(); applyPending(); }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data?.type === "refresh") applyPending(); });
}
async function enableNotifications() {
  const p = await Notification.requestPermission();
  if (p === "granted") { toast("Benachrichtigungen sind an"); registerPeriodic(); saveReminderState(); }
  else toast("Benachrichtigungen wurden nicht erlaubt");
  renderStart();
  if (!$("#sheet").classList.contains("hidden")) openSettings();
}
async function registerPeriodic() {
  try {
    if (!swReg || !("periodicSync" in swReg)) return;
    const st = await navigator.permissions.query({ name: "periodic-background-sync" });
    if (st.state === "granted") await swReg.periodicSync.register("tracker-reminder", { minInterval: 60 * 60 * 1000 });
  } catch {}
}
// Offene Punkte von heute als einzelne Einträge (jeder wird eine eigene Benachrichtigung mit „✓ Erledigt“)
function openItemsToday() {
  const k = todayKey(), done = S.days[k]?.done || {};
  const tasks = tasksFor(new Date()).filter(t => !done[t.key]).map(t => ({ id: "task-" + t.key, key: t.key, t: t.t, kind: t.kind === "weight" ? "weight" : "task" }));
  const todos = todosForToday().filter(t => !t.done).map(t => ({ id: "todo-" + t.id, todoId: t.id, t: t.text, kind: "todo" }));
  return [...tasks, ...todos];
}
function openTasksToday() { return openItemsToday().map(i => (i.kind === "todo" ? "To-Do: " : "") + i.t); }
// Gemeinsamer Plan für App und Service Worker
function reminderPlan() {
  const k = todayKey(), done = S.days[k]?.done || {};
  return {
    date: k, total: tasksFor(new Date()).length, general: REMIND_TIMES, items: openItemsToday(),
    tasks: [...tasksFor(new Date()).flatMap(t => remindsOf(t).map(time => ({ id: "task-" + t.key, key: t.key, t: t.t, time, done: !!done[t.key], kind: t.kind === "weight" ? "weight" : "task" }))),
      ...S.todos.filter(t => !t.done && t.remind && (!t.due || t.due <= k)).map(t => ({ id: "todo-" + t.id, key: "todo" + t.id, todoId: t.id, t: t.text, time: t.remind, done: false, kind: "todo" }))],
    pushOn: !!S.pushOn,
  };
}
async function readState() {
  const c = await caches.open("tracker-state");
  return { c, st: await c.match("state").then(r => r ? r.json() : {}).catch(() => ({})) };
}
async function saveReminderState() {
  try { const { c, st } = await readState(); const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || st.accent;
    await c.put("state", new Response(JSON.stringify({ ...st, plan: reminderPlan(), accent }))); } catch {}
  writePushCfg();
}
// Fällige Erinnerungen → Pakete mit Einträgen (höchstens 90 Minuten alt)
function dueNotifications(plan, fired, nowMin) {
  const out = [];
  const recent = t => toMin(t) <= nowMin && nowMin - toMin(t) <= 90;
  const gen = plan.general.filter(recent).filter(t => !fired.includes("g" + t)).pop();
  if (gen) out.push({ id: "g" + gen, items: plan.items });
  plan.general.filter(t => toMin(t) <= nowMin).forEach(t => { if (!fired.includes("g" + t) && t !== gen) out.push({ id: "g" + t, items: [] }); });
  for (const t of plan.tasks) {
    const id = "t" + t.key + t.time;
    if (fired.includes(id) || toMin(t.time) > nowMin) continue;
    out.push({ id, items: !t.done && recent(t.time) ? [t] : [] });
  }
  return out;
}
async function checkReminder() {
  if (!S.uid || !("Notification" in window) || Notification.permission !== "granted" || !swReg) return;
  if (S.pushOn) return;   // Push vom Server übernimmt die Erinnerungen
  const now = new Date(), plan = reminderPlan();
  const { c, st } = await readState();
  const fired = st.firedDate === plan.date ? (st.fired || []) : [];
  const due = dueNotifications(plan, fired, now.getHours() * 60 + now.getMinutes());
  if (!due.length) return;
  const items = [], seen = new Set();
  for (const n of due) { fired.push(n.id); for (const it of n.items) if (!seen.has(it.id)) { seen.add(it.id); items.push(it); } }
  if (items.length) (swReg.active || navigator.serviceWorker.controller)?.postMessage({ type: "show", payload: { date: plan.date, total: plan.total, items } });
  await c.put("state", new Response(JSON.stringify({ ...st, plan, firedDate: plan.date, fired })));
}
// Abhaken aus der Benachrichtigung, das der Service Worker nicht direkt speichern konnte, jetzt nachholen
async function applyPending() {
  if (!S.uid) return;
  try {
    const { c, st } = await readState();
    const pend = st.pending || []; if (!pend.length) return;
    await c.put("state", new Response(JSON.stringify({ ...st, pending: [] })));
    for (const p of pend) {
      if (p.kind === "todo") { const t = S.todos.find(x => x.id === p.todoId); if (t && !t.done) await toggleTodo(p.todoId); }
      else if (p.date === todayKey() && !S.days[p.date]?.done?.[p.key]) await toggleTask(p.date, p.key);
    }
    toast(`${pend.length} Punkt${pend.length > 1 ? "e" : ""} aus Benachrichtigungen abgehakt ✓`);
  } catch {}
}

/* ---------- Push vom Server (auch wenn die App geschlossen ist) ---------- */
let pushCfgT;
function writePushCfg() {
  if (!S.uid || !S.pushOn) return;
  clearTimeout(pushCfgT);
  pushCfgT = setTimeout(() => {
    const weekNames = {}, restDays = [];
    for (let d = 0; d < 7; d++) { const p = planFor(d); weekNames[d] = p.name; if (p.type === "rest") restDays.push(d); }
    const cfg = {
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Berlin",
      general: REMIND_TIMES, weekNames, restDays,
      tasks: (S.taskCfg || DEFAULT_TASKS).map(t => ({ key: t.key, t: t.t || "Training", days: t.days || null, remind: remindsOf(t)[0] || null, reminds: remindsOf(t), training: !!t.training, kind: t.kind || null })),
    };
    setDoc(userRef(), { push: { enabled: true, cfg } }, { merge: true }).catch(() => {});
  }, 800);
}
async function enablePush() {
  if (!VAPID_KEY) { toast("Push ist noch nicht eingerichtet (Schlüssel fehlt)"); return; }
  try {
    if (Notification.permission !== "granted" && (await Notification.requestPermission()) !== "granted") { toast("Benachrichtigungen wurden nicht erlaubt"); return; }
    const { getMessaging, getToken, isSupported } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    if (!(await isSupported())) { toast("Push wird von diesem Browser nicht unterstützt"); return; }
    const reg = swReg || await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error("kein Token");
    const u = await getDoc(userRef());
    const tokens = [...new Set([...(u.data()?.push?.tokens || []), token])].slice(-5);
    await setDoc(userRef(), { push: { enabled: true, tokens } }, { merge: true });
    S.pushOn = true; writePushCfg(); saveReminderState();
    toast("Push ist an – auch bei geschlossener App 🔔");
    openSettings();
  } catch (e) { toast("Push konnte nicht aktiviert werden: " + (e.code || e.message)); }
}
async function disablePush() {
  S.pushOn = false;
  try { await setDoc(userRef(), { push: { enabled: false } }, { merge: true }); } catch {}
  saveReminderState(); openSettings(); toast("Push ist aus");
}
setInterval(() => {
  if (S.uid && todayKey() !== S.curToday) { watchToday(); renderAll(); }   // Tageswechsel um Mitternacht
  checkReminder();
}, 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkReminder(); });
