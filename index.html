<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<title>Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Design sofort anwenden (bevor die Seite gezeichnet wird), damit nichts aufblitzt
  window.applyTheme = function (t) {
    t = t || {};
    var mode = t.mode || "dark", accent = t.accent || "#FFC400", r = document.documentElement;
    var light = mode === "light" || (mode === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
    r.dataset.theme = light ? "light" : "dark";
    r.style.setProperty("--accent", accent);
    var h = accent.replace("#", ""), R = parseInt(h.substr(0, 2), 16) / 255, G = parseInt(h.substr(2, 2), 16) / 255, B = parseInt(h.substr(4, 2), 16) / 255;
    var lin = function (c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    var L = 0.2126 * lin(R) + 0.7152 * lin(G) + 0.0722 * lin(B);
    r.style.setProperty("--accent-ink", L > 0.36 ? "#111111" : "#ffffff");
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = light ? "#f3f3f5" : "#0e0e0f";
  };
  try { applyTheme(JSON.parse(localStorage.getItem("tracker-theme") || "{}")); } catch (e) { applyTheme({}); }
</script>
<style>
  /* ============ FARBEN ============ */
  :root {
    --accent: #FFC400;          /* Akzentfarbe – in der App unter ⚙ Einstellungen änderbar */
    --accent-ink: #111111;      /* Schrift auf der Akzentfarbe */
    --accent-text: var(--accent);  /* Akzentfarbe als Schrift (im Hellmodus etwas dunkler) */
    --bg: #0e0e0f;
    --surface: #18181a;
    --surface-2: #222225;
    --border: #2e2e33;
    --text: #f2f2f3;
    --muted: #8b8b93;
    --danger: #ff5c5c;
    --radius: 14px;
    --shade: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f3f5;
    --surface: #ffffff;
    --surface-2: #ececef;
    --border: #dcdce2;
    --text: #141416;
    --muted: #6c6c75;
    --accent-text: color-mix(in srgb, var(--accent) 62%, #000);
    --shade: rgba(20,20,25,.35);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { min-height: 100dvh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  /* Layout */
  .app { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
  .eyebrow { color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: .02em; }
  h1 { font-size: 26px; font-weight: 800; margin: 2px 0 0; letter-spacing: -.02em; }
  h2 { font-size: 15px; font-weight: 700; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); }
  .icon-btn svg { width: 20px; height: 20px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .chip.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.block { width: 100%; }
  .muted { color: var(--muted); }

  /* Hero / Fortschritt */
  .hero { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .num b { font-size: 26px; font-weight: 800; display: block; line-height: 1; }
  .ring .num span { font-size: 12px; color: var(--muted); }
  .hero-text .big { font-size: 18px; font-weight: 700; }
  .stats { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  /* Wochenleiste */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .week .d { text-align: center; font-size: 11px; color: var(--muted); }
  .week .box { margin: 4px auto 0; width: 100%; aspect-ratio: 1; max-width: 40px; border-radius: 9px; border: 2px solid var(--border); background: var(--surface); }
  .week .box.full { background: var(--accent); border-color: var(--accent); }
  .week .box.part { border-color: var(--accent); }
  .week .box.today { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Aufgabenliste */
  .tasks { display: flex; flex-direction: column; gap: 8px; }
  .task { display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; padding: 6px 6px 6px 14px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); transition: border-color .15s, opacity .15s; min-height: 64px; }
  .task-main { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; text-align: left; padding: 8px 0; }
  .kg-in { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: none; }
  .kg-in .num-in { width: 76px; padding: 8px; }
  .kg-in small { color: var(--muted); font-size: 12px; }
  .mini.on { color: var(--accent-text); }
  .task .t { font-weight: 600; }
  .task .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .task.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
  .box-check { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; transition: all .15s; }
  .box-check svg { width: 18px; height: 18px; opacity: 0; transform: scale(.6); transition: all .15s; }
  .done .box-check { background: var(--accent); border-color: var(--accent); }
  .done .box-check svg { opacity: 1; transform: scale(1); }

  /* Kalender */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head b { font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .cal .c { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); display: grid; place-items: center;
    font-size: 14px; font-weight: 600; position: relative; }
  .cal .c.empty { visibility: hidden; }
  .cal .c.full { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .cal .c.part { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
  .cal .c.future { opacity: .35; }
  .cal .c.today { outline: 2px solid var(--text); outline-offset: 2px; }
  .cal .c.sel { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
  .cal .c .bar { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .cal .c .bar i { display: block; height: 100%; background: var(--accent); }
  .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--border); display: inline-block; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .kpi b { font-size: 22px; font-weight: 800; display: block; }
  .kpi span { font-size: 12px; color: var(--muted); }

  /* Training */
  .datebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .datebar .mid { text-align: center; }
  .select { width: 100%; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .ex { margin-top: 10px; }
  .ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .ex-head .n { font-weight: 700; font-size: 16px; }
  .ex-head .last { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .sets { margin-top: 12px; display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 32px; gap: 8px; align-items: center; }
  .sets .h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .sets .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
  .num-in { width: 100%; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); text-align: center; font-weight: 600; }
  .num-in:focus, .select:focus, textarea:focus, .text-in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .mini { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); }
  .mini:hover { background: var(--surface-2); }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; }
  .text-in, textarea { width: 100%; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  textarea { min-height: 80px; resize: vertical; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .saved { font-size: 12px; color: var(--muted); text-align: right; min-height: 16px; margin-top: 8px; }

  /* Bottom-Sheet für Übungsauswahl */
  .sheet-bg { position: fixed; inset: 0; background: var(--shade); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 640px; margin: 0 auto; background: var(--surface);
    border-top-left-radius: 20px; border-top-right-radius: 20px; border: 1px solid var(--border); max-height: 82dvh; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 10px auto 6px; }
  .sheet .inner { padding: 0 16px 16px; overflow: auto; }
  .sheet.tall { height: 84dvh; }
  .sheet.tall .inner { flex: 1; }
  .sheet-top { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 8px 0 6px; }
  .groups { position: relative; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-behavior: auto; }
  .groups .chip { flex: none; }
  .ex-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .ex-item { text-align: left; padding: 13px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; }
  .ex-item .muted { font-weight: 500; font-size: 12px; }

  /* Navigation unten */
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom .wrap { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  nav.bottom button { min-width: 0; position: relative; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
  nav.bottom .badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; }

  /* „Wie letztes Mal“-Karte */
  .repeat { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .repeat .top-row { display: flex; align-items: center; gap: 12px; }
  .repeat .ico { width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text);
    display: grid; place-items: center; flex: none; }
  .repeat ul { margin: 10px 0 12px; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .repeat li { margin: 2px 0; }

  /* To-Do */
  .add-row { display: flex; gap: 8px; }
  .add-row .text-in { flex: 1; }
  .add-row .plus { width: 48px; flex: none; padding: 0; font-size: 24px; }
  .when { display: flex; gap: 8px; margin-top: 10px; }
  .when .chip { cursor: pointer; }
  .todo { display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); }
  .todo .tap { display: flex; align-items: center; gap: 14px; flex: 1; text-align: left; min-width: 0; }
  .todo .t { font-weight: 600; word-break: break-word; }
  .todo .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .todo .s.late { color: var(--accent-text); }
  .todo.done .t { color: var(--muted); text-decoration: line-through; }
  .todo.done .box-check { background: var(--accent); border-color: var(--accent); }
  .todo.done .box-check svg { opacity: 1; transform: scale(1); }
  .swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 6px; }
  .sw { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; min-width: 0; }
  .sw span { width: 40px; height: 40px; border-radius: 12px; background: var(--c); border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border) inset; }
  .sw small { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw.on span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .sw.on small { color: var(--text); font-weight: 700; }
  /* Leistung / Diagramme */
  .perf-card { margin-top: 12px; }
  .perf-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .perf-head .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .perf-head .v { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .perf-head .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--text); }
  .chart { position: relative; margin-top: 10px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .ctip { position: absolute; transform: translate(-50%, -115%); background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 5px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; z-index: 2; }
  .chart [data-tip] { cursor: pointer; }
  .legend2 { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend2 span { display: inline-flex; align-items: center; gap: 6px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .seg .chip { flex: none; }
  .dialog { position: fixed; z-index: 71; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100vw - 32px));
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
  .dialog p { margin: 0 0 18px; font-size: 16px; font-weight: 600; line-height: 1.4; }
  .empty { text-align: center; padding: 22px 16px; color: var(--muted); }
  nav.bottom button svg { width: 24px; height: 24px; }
  nav.bottom button.on { color: var(--accent-text); }

  /* Login */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .login .logo { width: 84px; height: 84px; border-radius: 22px; background: var(--accent); display: grid; place-items: center; margin: 0 auto 18px; }
  .login .logo svg { width: 46px; height: 46px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--surface-2);
    border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; width: max-content; max-width: 90vw; text-align: center; }
  .banner { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .banner p { margin: 0; font-size: 14px; flex: 1; }
</style>
</head>
<body>

<!-- Ladebildschirm / Login -->
<div id="login" class="login hidden">
  <div>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Tracker</h1>
    <p class="muted" style="margin:8px 0 24px">Tägliche Aufgaben &amp; Training</p>
    <button id="loginBtn" class="btn primary">Mit Google anmelden</button>
    <p id="loginErr" class="muted" style="margin-top:16px;font-size:13px"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <section id="view-start"></section>
  <section id="view-cal" class="hidden"></section>
  <section id="view-train" class="hidden"></section>
  <section id="view-perf" class="hidden"></section>
  <section id="view-todo" class="hidden"></section>
</div>

<nav id="nav" class="bottom hidden">
  <div class="wrap">
    <button data-tab="start" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>Start</button>
    <button data-tab="cal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Überblick</button>
    <button data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Training</button>
    <button data-tab="perf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>Leistung</button>
    <button data-tab="todo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>To-Do<span id="todoBadge" class="badge hidden"></span></button>
  </div>
</nav>

<div id="sheetBg" class="sheet-bg hidden"></div>
<div id="sheet" class="sheet hidden"><div class="grab"></div><div class="inner" id="sheetInner"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="dlgBg" class="sheet-bg hidden" style="z-index:70"></div>
<div id="dlg" class="dialog hidden">
  <p id="dlgText"></p>
  <div class="two"><button class="btn" id="dlgNo">Nein</button><button class="btn primary" id="dlgYes">Ja, löschen</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, collection, query, where,
  orderBy, limit, getDocs, onSnapshot, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===================== FIREBASE ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyAl3xIGQSwkXTr3LlgOuPdg9hfM4He8Jcg",
  authDomain: "fir-8213f.firebaseapp.com",
  projectId: "fir-8213f",
  storageBucket: "fir-8213f.firebasestorage.app",
  messagingSenderId: "354733643310",
  appId: "1:354733643310:web:c87d3676b0e49f9740f1bf",
  measurementId: "G-MVKL8K15SN"
};

function tasksFor(date) {
  const wd = date.getDay(), p = planFor(wd);
  return (S.taskCfg || DEFAULT_TASKS)
    .filter(t => !t.days || t.days.includes(wd))
    .filter(t => !t.training || p.type !== "rest")
    .map(t => t.training ? { ...t, t: `Training: ${p.name}`, s: "laut Wochenplan" } : t);
}

/* ===================== LOGIN ===================== */
const provider = new GoogleAuthProvider();
$("#loginBtn").onclick = async () => {
  $("#loginErr").textContent = "";
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-environment", "auth/cancelled-popup-request"].includes(e.code)) {
      await signInWithRedirect(auth, provider);
    } else if (e.code !== "auth/popup-closed-by-user") {
      $("#loginErr").textContent = "Anmeldung fehlgeschlagen: " + e.code;
    }
  }
};
getRedirectResult(auth).catch(e => { $("#loginErr").textContent = "Anmeldung fehlgeschlagen: " + e.code; });

onAuthStateChanged(auth, async user => {
  if (!user) {
    S.uid = null;
    if (S.unsubToday) S.unsubToday();
    if (S.unsubTodos) S.unsubTodos();
    $("#login").classList.remove("hidden"); $("#app").classList.add("hidden"); $("#nav").classList.add("hidden");
    return;
  }
  S.uid = user.uid; S.name = (user.displayName || "").split(" ")[0];
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#nav").classList.remove("hidden");
  try {
    const u = await getDoc(userRef());
    S.custom = (u.exists() && u.data().custom) || {};
    S.hidden = (u.exists() && u.data().hidden) || {};
    if (u.exists() && Array.isArray(u.data().tasks)) S.taskCfg = u.data().tasks;
    if (u.exists() && u.data().theme) setTheme(u.data().theme, false);
    if (u.exists() && u.data().plan) { const pl = u.data().plan; if (Array.isArray(pl.types)) TYPES = pl.types; if (pl.week) WEEK = { ...DEFAULT_WEEK, ...pl.week }; }
    const ud = u.exists() ? u.data() : {};
    if (Array.isArray(ud.remindTimes)) REMIND_TIMES = ud.remindTimes;
    else if (ud.remindAt && /^\d\d:\d\d$/.test(ud.remindAt)) REMIND_TIMES = [ud.remindAt];
    // Gewicht-Aufgaben einmalig bei bestehender eigener Liste ergänzen
    if (S.taskCfg && !ud.weightAdded && !S.taskCfg.some(t => t.kind === "weight")) {
      S.taskCfg = [...DEFAULT_TASKS.filter(t => t.kind === "weight"), ...S.taskCfg];
      setDoc(userRef(), { tasks: S.taskCfg, weightAdded: true }, { merge: true }).catch(() => {});
    }
  } catch {}
  await loadRange(keyOf(addDays(new Date(), -120)), todayKey());
  watchToday();
  watchTodos();
  renderAll();
  loadWorkout(S.trainDate);
});

/* ===================== DATEN LADEN / SPEICHERN ===================== */
async function loadRange(fromK, toK) {
  const q = query(collection(db, "users", S.uid, "days"), where("date", ">=", fromK), where("date", "<=", toK));
  const snap = await getDocs(q);
  snap.forEach(d => { S.days[d.id] = d.data(); });
}
function watchToday() {
  if (S.unsubToday) S.unsubToday();
  S.curToday = todayKey();
  S.unsubToday = onSnapshot(dayRef(S.curToday), d => {
    if (d.exists()) S.days[S.curToday] = d.data();
    renderStart(); if (S.tab === "cal") renderCal();
    saveReminderState();
  });
}
async function toggleTask(k, key) {
  const date = fromKey(k);
  const tasks = tasksFor(date);
  const cur = S.days[k] || { done: {} };
  const done = { ...(cur.done || {}) };
  done[key] = !done[key];
  const count = tasks.filter(t => done[t.key]).length;
  const data = { date: k, done, weight: cur.weight || {}, count, total: tasks.length, complete: count === tasks.length };
  S.days[k] = data;
  renderStart(); if (S.tab === "cal") renderCal();
  if (data.complete && !cur.complete) toast("Quote erfüllt! 🔥");
  try { await setDoc(dayRef(k), data); } catch (e) { toast("Speichern fehlgeschlagen – bist du offline?"); }
}
async function setWeight(k, key, slot, raw) {
  const v = String(raw).trim().replace(",", ".");
  const num = v === "" ? "" : parseFloat(v);
  if (v !== "" && (isNaN(num) || num < 20 || num > 400)) { toast("Bitte ein gültiges Gewicht eingeben"); return; }
  const tasks = tasksFor(fromKey(k));
  const cur = S.days[k] || { done: {} };
  const done = { ...(cur.done || {}) }, weight = { ...(cur.weight || {}) };
  if (num === "") { delete weight[slot]; done[key] = false; } else { weight[slot] = num; done[key] = true; }
  const count = tasks.filter(t => done[t.key]).length;
  const data = { date: k, done, weight, count, total: tasks.length, complete: count === tasks.length };
  S.days[k] = data;
  renderStart(); if (S.tab === "cal") renderCal();
  if (data.complete && !cur.complete) toast("Quote erfüllt! 🔥");
  try { await setDoc(dayRef(k), data); } catch { toast("Speichern fehlgeschlagen – bist du offline?"); }
}
const dayInfo = k => {
  const d = S.days[k];
  const total = d?.total ?? tasksFor(fromKey(k)).length;
  const count = d?.count ?? 0;
  return { count, total, complete: !!d?.complete };
};
function streak() {
  let k = todayKey(), n = 0;
  if (!dayInfo(k).complete) k = keyOf(addDays(fromKey(k), -1));
  while (dayInfo(k).complete) { n++; k = keyOf(addDays(fromKey(k), -1)); }
  return n;
}

        <button class="icon-btn" data-action="logout" title="Abmelden">${ICON.out}</button>
      </div>
    </header>

      <div class="hero">
        <div class="ring">
          <svg width="104" height="104"><circle cx="52" cy="52" r="44" stroke="var(--surface-2)" stroke-width="10" fill="none"/>
            <circle cx="52" cy="52" r="44" stroke="var(--accent)" stroke-width="10" fill="none" stroke-linecap="round"
              stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .4s"/></svg>
          <div class="num"><div><b>${cnt}/${tasks.length}</b><span>erledigt</span></div></div>
        </div>

    <h2>Heute</h2>

    <button class="btn block" style="margin-top:10px;border-style:dashed;color:var(--accent-text)" data-action="newtask">+ Aufgabe hinzufügen</button>`;
}
const taskHTML = (t, isDone, k, editable = false) => {
  const sub = [t.s, !t.training ? daysTxt(t.days) : "", t.remind ? `🔔 ${t.remind}` : ""].filter(Boolean).join(" · ");
  const text = `<span style="min-width:0"><div class="t">${esc(t.t)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</span>`;
  let main;
  if (t.kind === "weight") {
    const val = S.days[k]?.weight?.[t.slot] ?? "";
    main = `<div class="task-main"><span class="box-check">${CHECK}</span>${text}
      <span class="kg-in"><input class="num-in" inputmode="decimal" placeholder="–" data-weight="${t.slot}" data-key="${t.key}" data-day="${k}" value="${esc(val)}"><small>kg</small></span></div>`;
  } else {
    main = `<button class="task-main" data-action="toggle" data-key="${t.key}" data-day="${k}"><span class="box-check">${CHECK}</span>${text}</button>`;
  }
  return `<div class="task ${isDone ? "done" : ""}">${main}${editable ? `
    <button class="mini ${t.remind ? "on" : ""}" data-action="taskbell" data-key="${t.key}" title="Erinnerung für diese Aufgabe">${ICON.bell.replace("<svg", '<svg width="17" height="17"')}</button>
    <button class="mini" data-action="deltask" data-key="${t.key}" title="Aufgabe löschen">${ICON.x}</button>` : ""}</div>`;
};

/* ===================== GESAMTÜBERBLICK (KALENDER) ===================== */
async function renderCal() {
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const daysIn = new Date(y, mo + 1, 0).getDate();
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;   // Montag zuerst
  const tk = todayKey();
  let cells = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(w => `<div class="wd">${w}</div>`).join("");
  cells += `<div class="c empty"></div>`.repeat(offset);
  let full = 0, past = 0;
  for (let d = 1; d <= daysIn; d++) {
    const dk = `${y}-${pad(mo + 1)}-${pad(d)}`, inf = dayInfo(dk);
    const future = dk > tk;
    if (!future) { past++; if (inf.complete) full++; }
    const cls = [inf.complete ? "full" : inf.count > 0 ? "part" : "", future ? "future" : "", dk === tk ? "today" : "", dk === S.calSel ? "sel" : ""].join(" ");
    const bar = (!inf.complete && inf.count > 0) ? `<span class="bar"><i style="width:${(inf.count / inf.total) * 100}%"></i></span>` : "";
    cells += `<button class="c ${cls}" data-action="calday" data-day="${dk}">${d}${bar}</button>`;
  }
  const sel = fromKey(S.calSel), selTasks = tasksFor(sel), selDone = S.days[S.calSel]?.done || {};
  const selFuture = S.calSel > tk;
  $("#view-cal").innerHTML = `
    <header class="top"><div><div class="eyebrow">Gesamtüberblick</div><h1>Deine Quoten</h1></div></header>
    <div class="kpis">
      <div class="kpi"><b>${full}/${past}</b><span>Tage erfüllt</span></div>
      <div class="kpi"><b>${past ? Math.round(full / past * 100) : 0}%</b><span>Quote ${MONTHS[mo].slice(0, 3)}.</span></div>

const lastCache = {};   // Übungsname -> Text "60 kg × 8 · 8 · 7"
async function loadLastFor(names) {
  const need = names.filter(n => !(n in lastCache));
  if (!need.length) return;
  try {
    const snap = { docs: prevDocs.map(p => ({ id: p.id, data: () => p })) };
    for (const n of need) {
      lastCache[n] = "";
      for (const d of snap.docs) {
        const ex = (d.data().exercises || []).find(e => e.name === n);
        const sets = ex?.sets?.filter(s => s.kg !== "" || s.reps !== "") || [];
        if (sets.length) {
          const kg = sets.map(s => parseFloat(String(s.kg).replace(",", "."))).filter(x => !isNaN(x));
          const kgTxt = kg.length ? `${String(Math.max(...kg)).replace(".", ",")} kg × ` : "";
          lastCache[n] = `Letztes Mal (${fromKey(d.id).getDate()}.${fromKey(d.id).getMonth() + 1}.): ${kgTxt}${sets.map(s => s.reps || "–").join(" · ")}`;

  } catch {}
}

/* ---- Diagramme (SVG, ohne Bibliothek) ---- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / (n - 1), mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
function lineChart(series, { unit = "", dec = 1, height = 170 } = {}) {
  const pts = series.flatMap(s => s.pts);
  if (!pts.length) return "";
  const W = 340, H = height, L = 36, Rm = 12, T = 14, B = 22;
  const xs = pts.map(p => fromKey(p.x).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = pts.map(p => p.y), ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = k => x1 === x0 ? L + (W - L - Rm) / 2 : L + (fromKey(k).getTime() - x0) / (x1 - x0) * (W - L - Rm);
  const Y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  let g = ticks.map(t => `<line x1="${L}" x2="${W - Rm}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${L - 6}" y="${Y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(t, 1)}</text>`).join("");
  const xl = [...new Set(pts.map(p => p.x))].sort();
  const lab = xl.length > 1 ? [xl[0], xl[xl.length - 1]] : xl;
  g += lab.map((k, i) => `<text x="${X(k)}" y="${H - 6}" text-anchor="${lab.length > 1 ? (i ? "end" : "start") : "middle"}" font-size="10" fill="var(--muted)">${dShort(k)}</text>`).join("");
  for (const s of series) {
    const sp = [...s.pts].sort((a, b) => a.x.localeCompare(b.x));
    if (sp.length > 1) g += `<path d="${sp.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    const dense = sp.length > 20;
    g += sp.map((p, i) => dense && i < sp.length - 1 ? "" : `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const last = sp[sp.length - 1];
    if (s.label !== false) g += `<text x="${Math.min(X(last.x), W - Rm)}" y="${Y(last.y) - 9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--text)">${fmtN(last.y, dec)}${unit}</text>`;
    g += sp.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="13" fill="transparent" data-tip="${esc(p.tip || `${dShort(p.x)}: ${fmtN(p.y, dec)}${unit}`)}" data-px="${X(p.x) / W * 100}" data-py="${Y(p.y) / H * 100}"/>`).join("");
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
function barChart(items, { unit = "", dec = 0, height = 150 } = {}) {
  if (!items.length) return "";
  const W = 340, H = height, L = 8, Rm = 8, T = 18, B = 22;
  const max = Math.max(1, ...items.map(i => i.y)), n = items.length;
  const slot = (W - L - Rm) / n, bw = Math.min(34, slot * .62);
  let g = `<line x1="${L}" x2="${W - Rm}" y1="${H - B}" y2="${H - B}" stroke="var(--border)"/>`;
  items.forEach((it, i) => {
    const cx = L + slot * (i + .5), h = (it.y / max) * (H - T - B), y = H - B - h;
    if (it.y > 0) {
      const r = Math.min(4, h, bw / 2);
      g += `<path d="M${cx - bw / 2},${H - B} V${y + r} Q${cx - bw / 2},${y} ${cx - bw / 2 + r},${y} H${cx + bw / 2 - r} Q${cx + bw / 2},${y} ${cx + bw / 2},${y + r} V${H - B} Z" fill="${it.dim ? "color-mix(in srgb, var(--accent) 35%, var(--surface-2))" : "var(--accent)"}"/>`;
      if (it.showVal) g += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${fmtN(it.y, dec)}${unit}</text>`;
    }
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="10" fill="${it.hl ? "var(--text)" : "var(--muted)"}" font-weight="${it.hl ? 700 : 400}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - slot / 2}" y="${T - 10}" width="${slot}" height="${H - T - B + 10}" fill="transparent" data-tip="${esc(it.tip || `${it.label}: ${fmtN(it.y, dec)}${unit}`)}" data-px="${cx / W * 100}" data-py="${Math.max(y, T) / H * 100}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
const deltaTxt = (a, b, unit = "%", dec = 1) => {
  if (b == null || !isFinite(a) || !isFinite(b)) return "";
  const d = unit === "%" ? (b ? (a - b) / b * 100 : 0) : a - b;
  const arrow = d > 0.05 ? "▲" : d < -0.05 ? "▼" : "■";
  return `<span class="delta">${arrow} ${d > 0 ? "+" : ""}${fmtN(d, dec)}${unit === "%" ? " %" : " " + unit}</span>`;
};

  const rng = S.perfRange || "3m";
  let html = `<header class="top"><div><div class="eyebrow">Leistung</div><h1>Deine Entwicklung</h1></div></header>
    <div class="seg">${chip("prange", "4w", rng, "4 Wochen")}${chip("prange", "3m", rng, "3 Monate")}${chip("prange", "6m", rng, "6 Monate")}${chip("prange", "all", rng, "Alles")}</div>`;
  if (!all) { v.innerHTML = html + `<div class="card empty perf-card">Lade Daten …</div>`; return; }

  /* --- 1. Kraft-Index pro Trainingsart --- */
  const gymTypes = ["Push", "Pull", "Ergänzungstraining", "Calisthenics"];
  const base = {};   // erster Wert jeder Übung = 100 %
  for (const w of all) for (const e of w.exercises || []) { const b = exBest(e); if (b > 0 && !(e.name in base)) base[e.name] = b; }
  const sessions = all.filter(w => gymTypes.includes(w.plan)).map(w => {
    const rel = (w.exercises || []).map(e => ({ e, b: exBest(e) })).filter(x => x.b > 0 && base[x.e.name]).map(x => x.b / base[x.e.name] * 100);
    return { date: w.date, plan: w.plan, idx: rel.length ? rel.reduce((a, b) => a + b, 0) / rel.length : null,
      vol: (w.exercises || []).reduce((a, e) => a + exVolume(e), 0), sets: (w.exercises || []).reduce((a, e) => a + exSets(e), 0), n: rel.length };
  }).filter(x => x.idx != null);
  const typesWithData = gymTypes.filter(t => sessions.some(x => x.plan === t));
  if (!S.perfType || !typesWithData.includes(S.perfType)) S.perfType = typesWithData[typesWithData.length - 1] || "Push";
  const ts = sessions.filter(x => x.plan === S.perfType && x.date >= from);
  html += `<div class="card perf-card">
    <div class="seg">${(typesWithData.length ? typesWithData : gymTypes).map(t => chip("ptype", t, S.perfType, t === "Ergänzungstraining" ? "Ergänzung" : t)).join("")}</div>`;
  if (ts.length) {
    const last = ts[ts.length - 1], prev = ts[ts.length - 2], first = ts[0];
    html += `<div class="perf-head" style="margin-top:14px"><div><div class="k">Kraft-Index ${esc(S.perfType)}</div><div class="v">${fmtN(last.idx, 0)}</div>
        <div class="d">${prev ? `${deltaTxt(last.idx, prev.idx)} zum letzten Mal` : "Erstes Training im Zeitraum"}</div></div>
      <div style="text-align:right"><div class="k">seit ${dShort(first.date)}</div><div class="d" style="margin-top:6px">${ts.length > 1 ? deltaTxt(last.idx, first.idx) : "–"}</div></div></div>
      ${lineChart([{ color: "var(--accent)", pts: ts.map(x => ({ x: x.date, y: x.idx, tip: `${dShort(x.date)}: Index ${fmtN(x.idx, 0)} · ${x.sets} Sätze · ${fmtN(x.vol, 0)} kg bewegt` })) }], { dec: 0 })}
      <div class="note">100 = deine erste Einheit je Übung. Der Index vergleicht den besten Satz jeder Übung mit deinem Start (geschätztes Maximalgewicht aus Gewicht × Wiederholungen, ohne Gewicht zählen die Wiederholungen).</div>`;
  } else html += `<div class="empty">Noch keine Daten für ${esc(S.perfType)} in diesem Zeitraum.<br>Trag im Training Gewicht und Wiederholungen ein.</div>`;
  html += `</div>`;

  /* --- 2. Woche Mo–So --- */
  const off = S.perfWeek || 0, today = new Date();
  const monday = addDays(today, -((today.getDay() + 6) % 7) + off * 7);
  const wk = [...Array(7)].map((_, i) => {
    const d = addDays(monday, i), k = keyOf(d), w = all.find(x => x.date === k);
    const sets = w ? (w.exercises || []).reduce((a, e) => a + exSets(e), 0) : 0;
    const vol = w ? (w.exercises || []).reduce((a, e) => a + exVolume(e), 0) : 0;
    const extra = w?.run?.km ? ` · ${w.run.km} km` : w?.session?.minutes ? ` · ${w.session.minutes} min` : "";
    return { label: WD[d.getDay()], y: sets, hl: k === todayKey(), showVal: sets > 0,
      tip: w ? `${WD[d.getDay()]} ${dShort(k)} · ${w.plan}: ${sets} Sätze${vol ? ` · ${fmtN(vol, 0)} kg` : ""}${extra}` : `${WD[d.getDay()]} ${dShort(k)}: kein Eintrag`, w };
  });
  const wSets = wk.reduce((a, x) => a + x.y, 0), wDays = wk.filter(x => x.w && hasContent(x.w)).length;
  html += `<div class="card perf-card">
    <div class="perf-head"><div><div class="k">${off === 0 ? "Diese Woche" : off === -1 ? "Letzte Woche" : `Woche ab ${dShort(keyOf(monday))}`}</div>
      <div class="v">${wSets} <span style="font-size:15px;font-weight:600;color:var(--muted)">Sätze</span></div><div class="d">${wDays} Trainingstag${wDays === 1 ? "" : "e"}</div></div>
      <div style="display:flex;gap:6px"><button class="icon-btn" data-action="pweek" data-v="-1">${ICON.left}</button><button class="icon-btn" data-action="pweek" data-v="1" ${off >= 0 ? "disabled style='opacity:.35'" : ""}>${ICON.right}</button></div></div>
    ${barChart(wk)}
    <div class="note">Tipp auf einen Tag für Details (Training, Sätze, bewegtes Gewicht).</div></div>`;

  /* --- 3. Übung im Detail --- */
  const exNames = [...new Set(all.flatMap(w => (w.exercises || []).filter(e => exBest(e) > 0).map(e => e.name)))].sort((a, b) => a.localeCompare(b, "de"));
  if (exNames.length) {
    if (!S.perfEx || !exNames.includes(S.perfEx)) {
      const lastW = [...all].reverse().find(w => (w.exercises || []).some(e => exBest(e) > 0));
      S.perfEx = lastW.exercises.find(e => exBest(e) > 0).name;
    }
    const hist = all.filter(w => w.date >= from).map(w => ({ w, e: (w.exercises || []).find(e => e.name === S.perfEx) })).filter(x => x.e && exBest(x.e) > 0);
    const weighted = hist.some(x => exWeighted(x.e));
    const pts = hist.map(x => {
      const top = [...(x.e.sets || [])].sort((a, b) => setScore(b) - setScore(a))[0];
      return { x: x.w.date, y: exBest(x.e), tip: `${dShort(x.w.date)}: ${numv(top.kg) ? `${top.kg} kg × ${top.reps}` : `${top.reps} Wdh.`}${weighted ? ` ≈ ${fmtN(exBest(x.e), 1)} kg max` : ""}` };
    });
    const best = pts.length ? Math.max(...pts.map(p => p.y)) : 0, lastP = pts[pts.length - 1], prevP = pts[pts.length - 2];
    html += `<div class="card perf-card">
      <div class="field" style="margin-top:0"><label>Übung im Detail</label>
        <select class="select" data-action="pex">${exNames.map(n => `<option ${n === S.perfEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>`;
    if (pts.length) {
      html += `<div class="perf-head" style="margin-top:14px"><div><div class="k">${weighted ? "Geschätztes Maximalgewicht" : "Beste Wiederholungen"}</div>
          <div class="v">${fmtN(lastP.y, weighted ? 1 : 0)}${weighted ? " kg" : ""}</div>
          <div class="d">${prevP ? `${deltaTxt(lastP.y, prevP.y, weighted ? "kg" : "Wdh.", weighted ? 1 : 0)} zum letzten Mal` : "Erster Eintrag im Zeitraum"}</div></div>
        <div style="text-align:right"><div class="k">Rekord</div><div class="v" style="font-size:20px">${fmtN(best, weighted ? 1 : 0)}${weighted ? " kg" : ""}</div>${lastP.y >= best && pts.length > 1 ? `<div class="d">🏆 neuer Rekord</div>` : ""}</div></div>
        ${lineChart([{ color: "var(--accent)", pts }], { unit: weighted ? " kg" : "", dec: weighted ? 1 : 0 })}`;
    } else html += `<div class="empty">Keine Einträge für diese Übung im Zeitraum.</div>`;
    html += `</div>`;
  }

  /* --- 4. Körpergewicht --- */
  const wDaysAll = Object.values(S.days).filter(d => d.weight && (d.weight.am || d.weight.pm) && d.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  html += `<div class="card perf-card">`;
  if (wDaysAll.length) {
    const am = wDaysAll.filter(d => d.weight.am).map(d => ({ x: d.date, y: numv(d.weight.am) }));
    const pm = wDaysAll.filter(d => d.weight.pm).map(d => ({ x: d.date, y: numv(d.weight.pm) }));
    const main = am.length ? am : pm, lastW = main[main.length - 1];
    const weekAgo = keyOf(addDays(fromKey(lastW.x), -7));
    const ref = [...main].reverse().find(p => p.x <= weekAgo);
    const last7 = main.filter(p => p.x > keyOf(addDays(new Date(), -7)));
    html += `<div class="perf-head"><div><div class="k">Körpergewicht ${am.length ? "morgens" : "abends"}</div><div class="v">${fmtN(lastW.y, 1)} kg</div>
        <div class="d">${ref ? `${deltaTxt(lastW.y, ref.y, "kg", 1)} in 7 Tagen` : "Noch keine Woche Daten"}</div></div>
      <div style="text-align:right"><div class="k">Ø 7 Tage</div><div class="v" style="font-size:20px">${last7.length ? fmtN(last7.reduce((a, p) => a + p.y, 0) / last7.length, 1) + " kg" : "–"}</div></div></div>
      ${lineChart([{ name: "Morgens", color: "var(--accent)", pts: am.map(p => ({ ...p, tip: `${dShort(p.x)} morgens: ${fmtN(p.y, 1)} kg` })) },
                   { name: "Abends", color: "var(--muted)", dash: true, label: false, pts: pm.map(p => ({ ...p, tip: `${dShort(p.x)} abends: ${fmtN(p.y, 1)} kg` })) }].filter(x => x.pts.length), { unit: " kg", dec: 1 })}
      ${am.length && pm.length ? `<div class="legend2"><span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="var(--accent)" stroke-width="2"/></svg>Morgens</span>
        <span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/></svg>Abends</span></div>` : ""}`;
  } else html += `<div class="k" style="font-size:13px;color:var(--muted);font-weight:600">Körpergewicht</div><div class="empty">Trag auf der Startseite dein Gewicht morgens und abends ein, dann siehst du hier den Verlauf.</div>`;
  html += `</div>`;

  /* --- 5. Laufen --- */
  const runs = all.filter(w => w.date >= from && numv(w.run?.km) > 0);
  if (runs.length) {
    const km = runs.reduce((a, w) => a + numv(w.run.km), 0);
    const paces = runs.filter(w => numv(w.run.minutes) > 0).map(w => numv(w.run.minutes) / numv(w.run.km));
    const bestPace = paces.length ? Math.min(...paces) : null;
    const pf = p => `${Math.floor(p)}:${pad(Math.round((p % 1) * 60) % 60)}`;
    html += `<div class="card perf-card"><div class="perf-head"><div><div class="k">Laufen</div><div class="v">${fmtN(km, 1)} km</div><div class="d">${runs.length} Läufe im Zeitraum</div></div>
      <div style="text-align:right"><div class="k">Beste Pace</div><div class="v" style="font-size:20px">${bestPace ? pf(bestPace) : "–"}</div><div class="d">min/km</div></div></div>
      ${barChart(runs.slice(-10).map(w => ({ label: dShort(w.date), y: numv(w.run.km), showVal: true,
        tip: `${dShort(w.date)}: ${w.run.km} km${numv(w.run.minutes) ? ` in ${w.run.minutes} min (${pf(numv(w.run.minutes) / numv(w.run.km))} min/km)` : ""}` })), { dec: 1 })}</div>`;
  }

  /* --- 6. Konsistenz: Quote pro Woche --- */
  const weeks = [...Array(8)].map((_, i) => {
    const mon = addDays(today, -((today.getDay() + 6) % 7) - (7 - i) * 7);
    let full = 0, cnt = 0;
    for (let j = 0; j < 7; j++) { const k = keyOf(addDays(mon, j)); if (k > todayKey()) continue; cnt++; if (dayInfo(k).complete) full++; }
    return { label: dShort(keyOf(mon)), y: cnt ? Math.round(full / cnt * 100) : 0, showVal: true, hl: i === 7, dim: i === 7,
      tip: `Woche ab ${dShort(keyOf(mon))}: ${full} von ${cnt} Tagen erfüllt` };
  });
  html += `<div class="card perf-card"><div class="perf-head"><div><div class="k">Konsistenz</div><div class="v">${weeks[6].y} %</div>
      <div class="d">Tagesquote letzte Woche ${deltaTxt(weeks[6].y, weeks[5].y, "Pkt.", 0)}</div></div></div>
    ${barChart(weeks, { unit: "%" })}<div class="note">Anteil der Tage pro Woche, an denen alle täglichen Aufgaben erledigt waren. Die laufende Woche ist heller.</div></div>`;

  v.innerHTML = html;
}

async function savePlan() {
  try { await setDoc(userRef(), { plan: { types: TYPES, week: WEEK } }, { merge: true }); } catch { toast("Speichern fehlgeschlagen – bist du offline?"); }
  renderStart(); renderTrain();
}
function openPlanEditor() {
  const f = S.planForm;
  let html = `<div class="sheet-top"><div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:18px">${f ? (f.i < 0 ? "Neue Trainingsart" : "Trainingsart bearbeiten") : "Trainingsplan"}</b><button class="mini" data-action="closesheet">${ICON.x}</button></div></div>`;
  if (f) {
    html += `<div class="field"><label>Name</label><input class="text-in" id="typeName" placeholder="z. B. Oberkörper, Schwimmen, Yoga" value="${esc(f.name)}"></div>
      <div class="field"><label>Art</label><div class="groups" style="flex-wrap:wrap">${Object.entries(KIND_LABEL).map(([k, l]) =>
        `<button class="chip ${f.type === k ? "accent" : ""}" data-action="typekind" data-v="${k}">${l}</button>`).join("")}</div></div>
      ${f.type === "gym" ? `<div class="field"><label>Muskelgruppen (erscheinen zuerst bei „Übung hinzufügen“)</label>
        <div class="groups" style="flex-wrap:wrap">${Object.keys(LIB).map(g => `<button class="chip ${f.groups.includes(g) ? "accent" : ""}" data-action="typegroup" data-v="${esc(g)}">${esc(g)}</button>`).join("")}</div></div>` : ""}
      <div class="two" style="margin-top:18px"><button class="btn" data-action="typecancel">Zurück</button><button class="btn primary" data-action="typesave">Speichern</button></div>`;
  } else {
    const order = [1, 2, 3, 4, 5, 6, 0];
    html += `<h2 style="margin-top:12px">Wochenplan</h2>
      <div class="tasks">${order.map(d => `<div class="card" style="padding:12px">
        <div style="font-weight:700;margin-bottom:8px">${WD_LONG[d]}</div>
        <div class="seg">${TYPES.map(t => `<button class="chip ${WEEK[d] === t.name ? "accent" : ""}" data-action="wkset" data-d="${d}" data-v="${esc(t.name)}">${esc(t.name)}</button>`).join("")}</div></div>`).join("")}</div>
      <h2>Trainingsarten</h2>
      <div class="tasks">${TYPES.map((t, i) => `<div class="todo">
        <button class="tap" data-action="typeedit" data-i="${i}"><span style="min-width:0"><div class="t">${esc(t.name)}</div>
          <div class="s">${KIND_LABEL[t.type] || t.type}${t.type === "gym" && t.groups?.length ? " · " + esc(t.groups.join(", ")) : ""}</div></span></button>
        <button class="mini" data-action="typeedit" data-i="${i}" title="Bearbeiten">✎</button>
        <button class="mini" data-action="typedel" data-i="${i}" title="Löschen">${ICON.x}</button></div>`).join("")}</div>
      <button class="btn block" style="margin-top:10px;border-style:dashed;color:var(--accent-text)" data-action="typenew">+ Trainingsart hinzufügen</button>
      <button class="btn block" style="margin-top:10px" data-action="closesheet">Fertig</button>`;
  }
  $("#sheetInner").innerHTML = html;
  showSheet(true);
}
async function saveTypeForm() {
  const f = S.planForm, name = $("#typeName").value.trim();
  if (!name) { $("#typeName").focus(); return; }
  if (TYPES.some((t, i) => t.name === name && i !== f.i)) { toast("Diesen Namen gibt es schon"); return; }
  const t = { name, type: f.type }; if (f.type === "gym") t.groups = f.groups;
  if (f.i < 0) TYPES.push(t);
  else {
    const old = TYPES[f.i].name; TYPES[f.i] = t;
    for (const d in WEEK) if (WEEK[d] === old) WEEK[d] = name;
    if (S.workout?.plan === old) S.workout.plan = name;
  }
  S.planForm = null;
  await savePlan(); openPlanEditor();
  toast("Gespeichert");
}
async function deleteType(i) {
  const t = TYPES[i]; if (!t) return;
  const used = Object.entries(WEEK).filter(([, n]) => n === t.name).map(([d]) => WD[d]);
  if (!(await askYesNo(`Willst du „${t.name}“ wirklich löschen?${used.length ? ` Die Tage ${used.join(", ")} werden dann zum Ruhetag.` : ""}`))) return;
  TYPES.splice(i, 1);
  const rest = TYPES.find(x => x.type === "rest")?.name || "Frei";
  for (const d in WEEK) if (WEEK[d] === t.name) WEEK[d] = rest;
  await savePlan(); openPlanEditor();
}

/* ===================== TO-DO ===================== */
const todoCol = () => collection(db, "users", S.uid, "todos");
function watchTodos() {
  if (S.unsubTodos) S.unsubTodos();
  S.unsubTodos = onSnapshot(todoCol(), snap => {
    S.todos = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.created || "").localeCompare(b.created || ""));
    updateTodoBadge();
    if (S.tab === "todo") renderTodo();
    if (S.tab === "start") renderStart();
    saveReminderState();
  });
}
// Alles, was heute dran ist: offen und fällig (auch Überfälliges) + heute erledigt
function todosForToday() {
  const tk = todayKey();
  return S.todos.filter(t => (!t.done && (!t.due || t.due <= tk)) || (t.done && t.doneDay === tk));
}
function updateTodoBadge() {
  const n = todosForToday().filter(t => !t.done).length, b = $("#todoBadge");
  b.textContent = n; b.classList.toggle("hidden", !n);
}
const todoHTML = t => {
  const tk = todayKey();
  let sub = "";
  if (!t.done && t.due && t.due < tk) { const d = fromKey(t.due); sub = `<div class="s late">seit ${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}. offen</div>`; }
  else if (!t.done && t.due && t.due > tk) { const d = fromKey(t.due); sub = `<div class="s">${t.due === keyOf(addDays(new Date(), 1)) ? "morgen" : `${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.`}</div>`; }
  return `<div class="todo ${t.done ? "done" : ""}">
    <button class="tap" data-action="todotoggle" data-id="${t.id}"><span class="box-check">${CHECK}</span>
      <span style="min-width:0"><div class="t">${esc(t.text)}</div>${sub}</span></button>
    <button class="mini" data-action="tododel" data-id="${t.id}" title="Löschen">${ICON.trash}</button></div>`;
};
function renderTodo() {
  const tk = todayKey();
  const today = todosForToday();
  const open = today.filter(t => !t.done), doneToday = today.filter(t => t.done);
  const later = S.todos.filter(t => !t.done && t.due && t.due > tk).sort((a, b) => a.due.localeCompare(b.due));
  const whenChip = (v, l) => `<button class="chip ${S.todoWhen === v ? "accent" : ""}" data-action="todowhen" data-v="${v}">${l}</button>`;
  $("#view-todo").innerHTML = `
    <header class="top"><div><div class="eyebrow">To-Do</div><h1>Was noch ansteht</h1></div></header>
    <div class="card">
      <div class="add-row">
        <input class="text-in" id="todoIn" placeholder="Neue Aufgabe …" enterkeyhint="done">
        <button class="btn primary plus" data-action="todoadd" title="Hinzufügen">+</button>
      </div>
      <div class="when">${whenChip("heute", "Heute")}${whenChip("morgen", "Morgen")}${whenChip("datum", "Datum …")}
        <input type="date" id="todoDate" class="text-in ${S.todoWhen === "datum" ? "" : "hidden"}" style="padding:6px 10px;width:auto" value="${S.todoDate || keyOf(addDays(new Date(), 2))}"></div>
    </div>
    <h2>Heute · ${open.length} offen</h2>
    <div class="tasks">${open.length ? open.map(todoHTML).join("") : `<div class="card empty">Nichts offen – stark! 💪</div>`}</div>
    ${later.length ? `<h2>Demnächst</h2><div class="tasks">${later.map(todoHTML).join("")}</div>` : ""}
    ${doneToday.length ? `<h2>Heute erledigt</h2><div class="tasks">${doneToday.map(todoHTML).join("")}</div>` : ""}`;
}
async function addTodo() {
  const inp = $("#todoIn"), text = inp.value.trim();
  if (!text) { inp.focus(); return; }
  let due = todayKey();
  if (S.todoWhen === "morgen") due = keyOf(addDays(new Date(), 1));
  if (S.todoWhen === "datum") due = $("#todoDate").value || due;
  inp.value = "";
  try { await addDoc(todoCol(), { text, due, done: false, created: new Date().toISOString() }); }
  catch { toast("Speichern fehlgeschlagen – bist du offline?"); }
  $("#todoIn")?.focus();
}
async function toggleTodo(id) {
  const t = S.todos.find(x => x.id === id); if (!t) return;
  const done = !t.done;
  try { await updateDoc(doc(db, "users", S.uid, "todos", id), { done, doneDay: done ? todayKey() : null }); } catch {}
}
async function deleteTodo(id) {
  const t = S.todos.find(x => x.id === id); if (!t) return;
  if (!(await askYesNo(`„${t.text}“ wirklich löschen?`))) return;
  try { await deleteDoc(doc(db, "users", S.uid, "todos", id)); } catch {}
}

/* ===================== TÄGLICHE AUFGABEN BEARBEITEN ===================== */
async function saveTaskCfg() {
  try { await setDoc(userRef(), { tasks: S.taskCfg }, { merge: true }); } catch { toast("Speichern fehlgeschlagen – bist du offline?"); }
  // Heutigen Stand an die neue Liste anpassen
  const k = todayKey(), tasks = tasksFor(new Date()), done = S.days[k]?.done || {};
  const count = tasks.filter(t => done[t.key]).length;
  S.days[k] = { date: k, done, weight: S.days[k]?.weight || {}, count, total: tasks.length, complete: tasks.length > 0 && count === tasks.length };
  try { await setDoc(dayRef(k), S.days[k]); } catch {}
  renderStart(); saveReminderState();
}
async function deleteTask(key) {
  const cfg = S.taskCfg || DEFAULT_TASKS;
  const t = cfg.find(x => x.key === key); if (!t) return;

    if (st.state === "granted") await swReg.periodicSync.register("tracker-reminder", { minInterval: 60 * 60 * 1000 });

function openTasksToday() {
  const k = todayKey(), done = S.days[k]?.done || {};
  const tasks = tasksFor(new Date()).filter(t => !done[t.key]).map(t => t.t);
  const todos = todosForToday().filter(t => !t.done).map(t => "To-Do: " + t.text);
  return [...tasks, ...todos];
}
// Gemeinsamer Plan für App und Service Worker: was soll heute wann erinnert werden?
function reminderPlan() {
  const k = todayKey(), done = S.days[k]?.done || {};
  return {
    date: k,
    general: REMIND_TIMES,
    open: openTasksToday(),
    tasks: tasksFor(new Date()).filter(t => t.remind).map(t => ({ key: t.key, t: t.t, time: t.remind, done: !!done[t.key] })),
  };
}
async function readState() {
  const c = await caches.open("tracker-state");
  return { c, st: await c.match("state").then(r => r ? r.json() : {}).catch(() => ({})) };
}
// Speichert den aktuellen Stand für den Service Worker (Erinnerung im Hintergrund)
async function saveReminderState() {
  try { const { c, st } = await readState(); await c.put("state", new Response(JSON.stringify({ ...st, plan: reminderPlan() }))); } catch {}
}
// Fällige Erinnerungen (höchstens 90 Minuten alt, damit nach langer Pause nicht alles auf einmal kommt)
function dueNotifications(plan, fired, nowMin) {
  const out = [];
  const recent = t => toMin(t) <= nowMin && nowMin - toMin(t) <= 90;
  const gen = plan.general.filter(recent).filter(t => !fired.includes("g" + t)).pop();
  if (gen) {
    out.push({ id: "g" + gen, title: plan.open.length ? `Noch ${plan.open.length} offen` : "Alles erledigt 🔥",
      body: plan.open.length ? plan.open.join(", ") : "Stark – heute ist alles abgehakt.", skip: !plan.open.length });
    plan.general.filter(t => toMin(t) <= nowMin).forEach(t => fired.includes("g" + t) || out.push({ id: "g" + t, skip: true }));
  }
  for (const t of plan.tasks) {
    const id = "t" + t.key + t.time;
    if (fired.includes(id) || toMin(t.time) > nowMin) continue;
    out.push({ id, title: t.t, body: "Noch nicht erledigt – jetzt abhaken?", skip: t.done || !recent(t.time) });
  }
  return out;
}
async function checkReminder() {
  if (!S.uid || !("Notification" in window) || Notification.permission !== "granted" || !swReg) return;
  const now = new Date(), plan = reminderPlan();
  const { c, st } = await readState();
  const fired = st.firedDate === plan.date ? (st.fired || []) : [];
  const due = dueNotifications(plan, fired, now.getHours() * 60 + now.getMinutes());
  if (!due.length) return;
  for (const n of due) {
    if (!n.skip) swReg.showNotification(n.title, { body: n.body, icon: "./icon-192.png", badge: "./icon-192.png", tag: n.id });
    fired.push(n.id);
  }
  await c.put("state", new Response(JSON.stringify({ ...st, plan, firedDate: plan.date, fired })));
}
setInterval(() => {
  if (S.uid && todayKey() !== S.curToday) { watchToday(); renderAll(); }   // Tageswechsel um Mitternacht
  checkReminder();
}, 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkReminder(); });
</script>
