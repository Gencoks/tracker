<script>
  // Design sofort anwenden (bevor die Seite gezeichnet wird), damit nichts aufblitzt
  window.applyTheme = function (t) {
    t = t || {};
    var mode = t.mode || "dark", accent = t.accent || "#FFC400", r = document.documentElement;
    if (mode === "system") mode = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    var light = mode === "light" || mode === "white";
    r.dataset.theme = mode;   // dark | black | light | white
    r.style.setProperty("--accent", accent);
    var h = accent.replace("#", ""), R = parseInt(h.substr(0, 2), 16) / 255, G = parseInt(h.substr(2, 2), 16) / 255, B = parseInt(h.substr(4, 2), 16) / 255;

<style>
  /* ============ FARBEN ============ */
  :root {
    --accent: #FFC400;          /* Akzentfarbe – in der App unter ⚙ Einstellungen änderbar */
    --accent-ink: #111111;      /* Schrift auf der Akzentfarbe */
    --accent-text: var(--accent);  /* Akzentfarbe als Schrift (im Hellmodus etwas dunkler) */
    --bg: #0e0e0f;
    --surface: #18181a;
    --surface-2: #222225;
    --border: #2e2e33;
    --text: #f2f2f3;

    --danger: #ff5c5c;
    --radius: 14px;
    --shade: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  :root[data-theme="light"] {

    --surface: #ffffff;
    --surface-2: #ececef;
    --border: #dcdce2;
    --text: #141416;
    --muted: #6c6c75;
    --shade: rgba(20,20,25,.35);
    color-scheme: light;
  }
  :root[data-theme="white"] {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f2f2f4;
    --border: #e2e2e8;
    --text: #0b0b0c;
    --muted: #6c6c75;
    --shade: rgba(20,20,25,.3);
    color-scheme: light;
  }
  :root[data-theme="black"] {
    --bg: #000000;
    --surface: #0d0d0e;
    --surface-2: #19191b;
    --border: #262629;
    --text: #f4f4f5;
    --muted: #8b8b93;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { min-height: 100dvh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  /* ===== Rang-Designs ===== */
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #FFC400; }
  @property --mshift { syntax: "<length>"; inherits: true; initial-value: 0px; }
  /* Farbfluss (GOD-LEVEL): ein gemeinsamer Verlauf, der über die ganze Bildschirmbreite gleichmäßig von links nach rechts läuft */
  :root.cosm-myth { animation: mythCycle 14s linear infinite, mythShift 9s linear infinite; --accent-text: var(--accent) !important; --accent-edge: var(--accent) !important; }
  @keyframes mythShift { from { --mshift: 0px; } to { --mshift: 100vw; } }
  :root.cosm-myth :is(.btn.primary, .chip.accent, .switch button.on, .week .box.full, .done .box-check, .check-row.on .box-check, .cal .c.full, .cal .c .bar i, .ck-box.on, .dp-d.sel, .dial-tabs button.on, .tw-hl, nav.bottom .badge, .tc-d .dots i, .legend i[style*="accent"], .opt.on):not(#view-perf *) {
    background-image: var(--myth-grad) !important; background-size: 100vw 100% !important; background-repeat: repeat-x !important;
    background-position: calc(var(--mshift) - var(--ex, 0px)) 0 !important; border-color: transparent !important; }
  :root.cosm-myth .opt.on:not(#view-perf *) { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  :root.cosm-myth .opt.on small { color: rgba(255,255,255,.85); }
  :root.cosm-myth .ring-prog:not(#view-perf *), :root.cosm-myth .chart path[stroke="var(--accent)"]:not(#view-perf *) { stroke: url(#mythSvg); }
  :root.cosm-myth .chart :is(path, circle)[fill="var(--accent)"]:not(#view-perf *) { fill: url(#mythSvg); }
  /* Leistung bleibt immer im Standard-Design */
  :root.cosm-myth #view-perf { --accent: var(--accent-base); --accent-text: var(--accent-text-base); --accent-edge: var(--accent-base); }
  /* Karten-Deko (nicht im Bereich Leistung) */
  :root[data-deco]:not([data-deco=""]) .app > section:not(#view-perf) .card:not(.shine) { position: relative; isolation: isolate; }
  :root[data-deco=neon] .app > section:not(#view-perf) .card:not(.shine)::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.6px; pointer-events: none; z-index: 2;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; background-size: 300% 100%; animation: decoSweep 7s linear infinite;
    background-image: linear-gradient(90deg, var(--accent), #fff, var(--accent), color-mix(in srgb, var(--accent) 40%, #4CC9F0), var(--accent)); }
  :root[data-deco=neon] .app > section:not(#view-perf) .card:not(.shine) { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 28%, transparent), inset 0 0 10px color-mix(in srgb, var(--accent) 10%, transparent); animation: neonPulse 3s ease-in-out infinite alternate; }

  /* Farbverlauf-Hintergründe (je Rang einer) */
  #bggrad { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; overflow: hidden; }
  #bggrad i { position: absolute; inset: -30%; display: block; }
  #bggrad i:nth-child(1) { animation: gradDrift1 38s ease-in-out infinite alternate; }

  #bggrad.scene .sc { display: block; } #bggrad.scene i { display: none; }
  #bggrad.flow i:nth-child(1) { inset: 0; animation: bgFlow 10s linear infinite; }

  @keyframes bgFlow { from { background-position: 100% 0, 0 0; } to { background-position: 0 0, 0 0; } }
  @keyframes gradDrift1 { from { transform: translate(-4%, -3%) rotate(0deg) scale(1); } to { transform: translate(5%, 4%) rotate(8deg) scale(1.08); } }
  @keyframes gradDrift2 { from { transform: translate(5%, 3%) rotate(0deg) scale(1.05); } to { transform: translate(-5%, -4%) rotate(-10deg) scale(1); } }
  :root.cosm-bg #bggrad { display: block; }
  :root.cosm-bg, :root.cosm-bg body { background: #05050a; }
  :root.cosm-bg .app { position: relative; z-index: 1; }
  :root.cosm-bg .app > section:not(#view-perf) :is(.card, .task, .todo, .rec2, .kpi) { background-color: color-mix(in srgb, var(--surface) 64%, transparent); border-color: rgba(255,255,255,.12); }
  :root.cosm-bg #view-perf :is(.card, .task, .kpi, .rec2) { background-color: var(--surface); }
  :root.cosm-bg nav.bottom { background: rgba(8,8,12,.74); }
  @media (prefers-reduced-motion: reduce) { #bggrad i { animation: none !important; } }

  @keyframes earWig { to { transform: rotate(-12deg); } }

const paceOf = (km, min) => { const k = parseFloat(String(km || "").replace(",", ".")), m = parseDur(min); if (!k || !m) return ""; const p = m / k, mm = Math.floor(p), ss = Math.round((p - mm) * 60); return `${ss === 60 ? mm + 1 : mm}:${String(ss === 60 ? 0 : ss).padStart(2, "0")}`; };
const setTxt = (st, mode) => mode === "cardio" ? `${st.km || "–"} km${st.min ? ` in ${durTxt(st.min)}` : ""}${paceOf(st.km, st.min) ? ` (${paceOf(st.km, st.min)}/km)` : ""}`

async function loadRange(fromK, toK) {
  const q = query(collection(db, "users", S.uid, "days"), where("date", ">=", fromK), where("date", "<=", toK));
  const snap = await getDocs(q);
  snap.forEach(d => { S.days[d.id] = d.data(); });
}
function watchToday() {
  if (S.unsubToday) S.unsubToday();
  S.curToday = todayKey();
  S.unsubToday = onSnapshot(dayRef(S.curToday), d => {
    if (d.exists()) S.days[S.curToday] = d.data();
    renderStart(); if (S.tab === "cal") renderCal();
    saveReminderState();
  });
}
async function toggleTask(k, key) {
  const date = fromKey(k);
  const tasks = tasksFor(date);
  const cur = S.days[k] || { done: {} };
  const done = { ...(cur.done || {}) };
  done[key] = !done[key];
  const count = tasks.filter(t => done[t.key]).length;
  const data = { date: k, done, weight: cur.weight || {}, count, total: tasks.length, complete: count === tasks.length, autoTrain: false };
  S.days[k] = data;
  renderStart(); if (S.tab === "cal") renderCal();
  if (data.complete && !cur.complete) quotaDone();
  try { await setDoc(dayRef(k), data); } catch (e) { toast("Speichern fehlgeschlagen – bist du offline?"); }
}
// Training komplett? = alles eingetragen, was geplant war
const trainKey = () => (S.taskCfg || DEFAULT_TASKS).find(t => t.training)?.key || "training";
function woComplete(w) {
  if (!w) return false;
  const pl = planByName(w.plan), type = pl?.type || ((w.exercises || []).length ? "gym" : null);
  if (type === "run") return numv(w.run?.km) > 0 && parseDur(w.run?.minutes) > 0;
  if (type === "session") return numv(w.session?.minutes) > 0;
  const ex = (w.exercises || []).filter(e => exMode(e) !== "cardio" || (e.sets || []).length);
  return ex.length > 0 && ex.every(e => (e.sets || []).length > 0 && e.sets.every(setFilled));
}
// Hakt die Trainings-Aufgabe automatisch ab, sobald das Training vollständig eingetragen ist
async function syncTrainTask(k, w) {
  const key = trainKey(), tasks = tasksFor(fromKey(k));
  if (!tasks.some(t => t.key === key)) return;
  if (!S.days[k]) { try { const d = await getDoc(dayRef(k)); if (d.exists()) S.days[k] = d.data(); } catch { return; } }
  const cur = S.days[k] || { done: {} }, full = woComplete(w), isDone = !!cur.done?.[key];
  let val = null;
  if (full && !isDone) val = true;
  else if (!full && isDone && cur.autoTrain) val = false;   // nur zurücknehmen, wenn es automatisch gesetzt wurde
  if (val === null) return;
  const done = { ...(cur.done || {}), [key]: val }, count = tasks.filter(t => done[t.key]).length;
  const data = { ...cur, date: k, done, weight: cur.weight || {}, count, total: tasks.length, complete: count === tasks.length, autoTrain: val };
  S.days[k] = data;
  if (val) { if (data.complete && !cur.complete) quotaDone(); else toast("Training vollständig – Aufgabe abgehakt ✓"); }
  if (S.tab === "start") renderStart();
  try { await setDoc(dayRef(k), data); } catch {}
}
async function setWeight(k, key, slot, raw) {
  const v = String(raw).trim().replace(",", ".");
  const num = v === "" ? "" : parseFloat(v);
  if (v !== "" && (isNaN(num) || num < 20 || num > 400)) { toast("Bitte ein gültiges Gewicht eingeben"); return; }
  const tasks = tasksFor(fromKey(k));
  const cur = S.days[k] || { done: {} };
  const done = { ...(cur.done || {}) }, weight = { ...(cur.weight || {}) };
  if (num === "") { delete weight[slot]; done[key] = false; } else { weight[slot] = num; done[key] = true; }
  const count = tasks.filter(t => done[t.key]).length;
  const data = { date: k, done, weight, count, total: tasks.length, complete: count === tasks.length };
  S.days[k] = data;
  renderStart(); if (S.tab === "cal") renderCal();
  if (data.complete && !cur.complete) quotaDone();
  try { await setDoc(dayRef(k), data); } catch { toast("Speichern fehlgeschlagen – bist du offline?"); }
}
const dayInfo = k => {
  const d = S.days[k];
  const total = d?.total ?? tasksFor(fromKey(k)).length;
  const count = d?.count ?? 0;
  return { count, total, complete: !!d?.complete };
};
function streak() {
  let k = todayKey(), n = 0;
  if (!dayInfo(k).complete) k = keyOf(addDays(fromKey(k), -1));
  while (dayInfo(k).complete) { n++; k = keyOf(addDays(fromKey(k), -1)); }
  return n;
}

async function renderCal() {

  cells += `<div class="c empty"></div>`.repeat(offset);

  for (let d = 1; d <= daysIn; d++) {
    const dk = `${y}-${pad(mo + 1)}-${pad(d)}`, inf = dayInfo(dk);
    const future = dk > tk;
    if (!future) { past++; if (inf.complete) full++; }
    const cls = [inf.complete ? "full" : inf.count > 0 ? "part" : "", future ? "future" : "", dk === tk ? "today" : "", dk === S.calSel ? "sel" : ""].join(" ");

      <div class="legend"><span><i style="background:var(--accent);border-color:var(--accent)"></i>alles erledigt</span>

  } catch {}
  await loadPrevious(k);

// Letzte Trainings vor dem gewählten Tag (für „Letztes Mal“ und „Wie letzten Montag“)
let prevDocs = [], prevFor = null;
async function loadPrevious(k) {
  if (prevFor === k) return;
  try {
    const q = query(collection(db, "users", S.uid, "workouts"), where("date", "<", k), orderBy("date", "desc"), limit(40));
    prevDocs = (await getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
    prevFor = k;
    for (const n in lastCache) delete lastCache[n];
  } catch { prevDocs = []; }
}
const hasContent = w => (w.exercises || []).length > 0 || !!(w.run?.km || w.run?.minutes) || !!(w.session?.minutes || w.session?.note);
function findPrevSame() {
  S.prevSame = prevDocs.find(d => d.plan === S.workout.plan && hasContent(d)) || null;
}
function copyPrevious() {
  const p = S.prevSame; if (!p) return;
  const clone = x => JSON.parse(JSON.stringify(x || {}));
  S.workout.exercises = clone(p.exercises || []);
  S.workout.run = { km: p.run?.km || "", minutes: p.run?.minutes || "" };
  S.workout.session = { minutes: p.session?.minutes || "" };
  loadLastFor(S.workout.exercises.map(e => e.name)).then(() => saveWorkout(true));
  toast("Übernommen – passe an, was heute anders ist");
}
const lastCache = {};   // Übungsname -> Text "60 kg × 8 · 8 · 7"
async function loadLastFor(names) {
  const need = names.filter(n => !(n in lastCache));
  if (!need.length) return;
  try {
    const snap = { docs: prevDocs.map(p => ({ id: p.id, data: () => p })) };
    for (const n of need) {
      lastCache[n] = "";
      for (const d of snap.docs) {
        const ex = (d.data().exercises || []).find(e => e.name === n);
        const sets = ex?.sets?.filter(setFilled) || [];
        if (sets.length) {
          const mode = exMode(ex);
          let txt;
          if (mode === "weight") {
            const kg = sets.map(s => parseFloat(String(s.kg ?? "").replace(",", "."))).filter(x => !isNaN(x));
            txt = `${kg.length ? `${String(Math.max(...kg)).replace(".", ",")} kg × ` : ""}${sets.map(s => s.reps || "–").join(" · ")}`;
          } else txt = sets.map(s => setTxt(s, mode)).join(" · ");
          lastCache[n] = `Letztes Mal (${fromKey(d.id).getDate()}.${fromKey(d.id).getMonth() + 1}.): ${txt}`;
          break;
        }
      }
    }
  } catch {}
}

const numv = x => { const v = parseFloat(String(x ?? "").replace(",", ".")); return isNaN(v) ? 0 : v; };
const fmtN = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("de-DE");
const dShort = k => { const d = fromKey(k); return `${d.getDate()}.${d.getMonth() + 1}.`; };
// Bester Satz einer Übung: mit Gewicht = geschätztes Maximalgewicht (Epley), ohne Gewicht = Wiederholungen
// Kraft: mit Gewicht = geschätztes Maximalgewicht (Epley), sonst Wiederholungen. Ausdauer zählt nicht zur Kraft.
const setScore = st => { const kg = numv(st.kg), r = numv(st.reps); if (!r) return 0; return kg > 0 ? kg * (1 + r / 30) : r; };
const exBest = e => { const m = exMode(e); if (m === "cardio") return 0; if (m === "time") return Math.max(0, ...(e.sets || []).map(x => numv(x.sec)));
  return Math.max(0, ...(e.sets || []).map(setScore)); };
const exWeighted = e => exMode(e) === "weight" && (e.sets || []).some(x => numv(x.kg) > 0 && numv(x.reps) > 0);
const exVolume = e => exMode(e) === "weight" ? (e.sets || []).reduce((a, x) => a + numv(x.kg) * numv(x.reps), 0) : 0;
const exSets = e => (e.sets || []).filter(x => numv(x.reps) > 0 || numv(x.km) > 0 || numv(x.sec) > 0).length;
// Alle Ausdauer-Einträge (eigener Lauftag + Ausdauer-Übungen vor dem Training)
function cardioEntries(all) {
  const out = [];
  for (const w of all) {
    if (numv(w.run?.km) > 0) out.push({ date: w.date, name: "Laufen", km: numv(w.run.km), min: parseDur(w.run.minutes) });
    for (const e of w.exercises || []) if (exMode(e) === "cardio") {

      if (km > 0) out.push({ date: w.date, name: e.name, km, min });

}

/* ---- Diagramme (SVG, ohne Bibliothek) ---- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / (n - 1), mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}
function lineChart(series, { unit = "", dec = 1, height = 170 } = {}) {
  const pts = series.flatMap(s => s.pts);
  if (!pts.length) return "";
  const W = 340, H = height, L = 36, Rm = 12, T = 14, B = 22;
  const xs = pts.map(p => fromKey(p.x).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = pts.map(p => p.y), ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = k => x1 === x0 ? L + (W - L - Rm) / 2 : L + (fromKey(k).getTime() - x0) / (x1 - x0) * (W - L - Rm);
  const Y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  let g = ticks.map(t => `<line x1="${L}" x2="${W - Rm}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${L - 6}" y="${Y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(t, 1)}</text>`).join("");
  const xl = [...new Set(pts.map(p => p.x))].sort();
  const lab = xl.length > 1 ? [xl[0], xl[xl.length - 1]] : xl;
  g += lab.map((k, i) => `<text x="${X(k)}" y="${H - 6}" text-anchor="${lab.length > 1 ? (i ? "end" : "start") : "middle"}" font-size="10" fill="var(--muted)">${dShort(k)}</text>`).join("");
  for (const s of series) {
    const sp = [...s.pts].sort((a, b) => a.x.localeCompare(b.x));
    if (sp.length > 1) g += `<path d="${sp.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    const dense = sp.length > 20;
    g += sp.map((p, i) => dense && i < sp.length - 1 ? "" : `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const last = sp[sp.length - 1];
    if (s.label !== false) g += `<text x="${Math.min(X(last.x), W - Rm)}" y="${Y(last.y) - 9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--text)">${fmtN(last.y, dec)}${unit}</text>`;
    g += sp.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="13" fill="transparent" data-tip="${esc(p.tip || `${dShort(p.x)}: ${fmtN(p.y, dec)}${unit}`)}" data-px="${X(p.x) / W * 100}" data-py="${Y(p.y) / H * 100}"/>`).join("");
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
function barChart(items, { unit = "", dec = 0, height = 150 } = {}) {
  if (!items.length) return "";
  const W = 340, H = height, L = 8, Rm = 8, T = 18, B = 22;
  const max = Math.max(1, ...items.map(i => i.y)), n = items.length;
  const slot = (W - L - Rm) / n, bw = Math.min(34, slot * .62);
  let g = `<line x1="${L}" x2="${W - Rm}" y1="${H - B}" y2="${H - B}" stroke="var(--border)"/>`;
  items.forEach((it, i) => {
    const cx = L + slot * (i + .5), h = (it.y / max) * (H - T - B), y = H - B - h;
    if (it.y > 0) {
      const r = Math.min(4, h, bw / 2);
      g += `<path d="M${cx - bw / 2},${H - B} V${y + r} Q${cx - bw / 2},${y} ${cx - bw / 2 + r},${y} H${cx + bw / 2 - r} Q${cx + bw / 2},${y} ${cx + bw / 2},${y + r} V${H - B} Z" fill="${it.dim ? "color-mix(in srgb, var(--accent) 35%, var(--surface-2))" : "var(--accent)"}"/>`;
      if (it.showVal) g += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${fmtN(it.y, dec)}${unit}</text>`;
    }
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="10" fill="${it.hl ? "var(--text)" : "var(--muted)"}" font-weight="${it.hl ? 700 : 400}">${esc(it.label)}</text>`;
    g += `<rect x="${cx - slot / 2}" y="${T - 10}" width="${slot}" height="${H - T - B + 10}" fill="transparent" data-tip="${esc(it.tip || `${it.label}: ${fmtN(it.y, dec)}${unit}`)}" data-px="${cx / W * 100}" data-py="${Math.max(y, T) / H * 100}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
const deltaTxt = (a, b, unit = "%", dec = 1) => {
  if (b == null || !isFinite(a) || !isFinite(b)) return "";
  const d = unit === "%" ? (b ? (a - b) / b * 100 : 0) : a - b;
  const arrow = d > 0.05 ? "▲" : d < -0.05 ? "▼" : "■";
  return `<span class="delta">${arrow} ${d > 0 ? "+" : ""}${fmtN(d, dec)}${unit === "%" ? " %" : " " + unit}</span>`;
};

    const vol = w ? (w.exercises || []).reduce((a, e) => a + exVolume(e), 0) : 0;
    const extra = w?.run?.km ? ` · ${w.run.km} km` : w?.session?.minutes ? ` · ${w.session.minutes} min` : "";
    return { label: WD[d.getDay()], y: sets, hl: k === todayKey(), showVal: sets > 0,
      tip: w ? `${WD[d.getDay()]} ${dShort(k)} · ${w.plan}: ${sets} Sätze${vol ? ` · ${fmtN(vol, 0)} kg` : ""}${extra}` : `${WD[d.getDay()]} ${dShort(k)}: kein Eintrag`, w };
  });
  const wSets = wk.reduce((a, x) => a + x.y, 0), wDays = wk.filter(x => x.w && hasContent(x.w)).length;
  html += `<div class="card perf-card">
    <div class="perf-head"><div><div class="k">${off === 0 ? "Diese Woche" : off === -1 ? "Letzte Woche" : `Woche ab ${dShort(keyOf(monday))}`}</div>
      <div class="v">${wSets} <span style="font-size:15px;font-weight:600;color:var(--muted)">Sätze</span></div><div class="d">${wDays} Trainingstag${wDays === 1 ? "" : "e"}</div></div>
      <div style="display:flex;gap:6px"><button class="icon-btn" data-action="pweek" data-v="-1">${ICON.left}</button><button class="icon-btn" data-action="pweek" data-v="1" ${off >= 0 ? "disabled style='opacity:.35'" : ""}>${ICON.right}</button></div></div>
    ${barChart(wk)}
    <div class="note">Tipp auf einen Tag für Details (Training, Sätze, bewegtes Gewicht).</div></div>`;

  /* --- 3. Übung im Detail --- */
  const exNames = [...new Set(all.flatMap(w => (w.exercises || []).filter(e => exBest(e) > 0).map(e => e.name)))].sort((a, b) => a.localeCompare(b, "de"));
  if (exNames.length) {
    if (!S.perfEx || !exNames.includes(S.perfEx)) {
      const lastW = [...all].reverse().find(w => (w.exercises || []).some(e => exBest(e) > 0));
      S.perfEx = lastW.exercises.find(e => exBest(e) > 0).name;
    }
    const hist = all.filter(w => w.date >= from).map(w => ({ w, e: (w.exercises || []).find(e => e.name === S.perfEx) })).filter(x => x.e && exBest(x.e) > 0);
    const weighted = hist.some(x => exWeighted(x.e));
    const dm = hist.length ? exMode(hist[hist.length - 1].e) : "weight", isTime = dm === "time";
    const unitD = weighted ? " kg" : isTime ? " s" : "";
    const pts = hist.map(x => {
      const top = [...(x.e.sets || [])].sort((a, b) => (exMode(x.e) === "time" ? numv(b.sec) - numv(a.sec) : setScore(b) - setScore(a)))[0];
      return { x: x.w.date, y: exBest(x.e), tip: `${dShort(x.w.date)}: ${setTxt(top, exMode(x.e))}${exMode(x.e) === "band" ? " Wdh." : ""}${weighted ? ` ≈ ${fmtN(exBest(x.e), 1)} kg max` : ""}` };
    });
    const best = pts.length ? Math.max(...pts.map(p => p.y)) : 0, lastP = pts[pts.length - 1], prevP = pts[pts.length - 2];
    html += `<div class="card perf-card">
      <div class="field" style="margin-top:0"><label>Übung im Detail</label>
        <select class="select" data-action="pex">${exNames.map(n => `<option ${n === S.perfEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>`;
    if (pts.length) {
      html += `<div class="perf-head" style="margin-top:14px"><div><div class="k">${weighted ? "Geschätztes Maximalgewicht" : isTime ? "Längste Zeit" : "Beste Wiederholungen"}</div>
          <div class="v">${fmtN(lastP.y, weighted ? 1 : 0)}${unitD}</div>
          <div class="d">${prevP ? `${deltaTxt(lastP.y, prevP.y, weighted ? "kg" : isTime ? "s" : "Wdh.", weighted ? 1 : 0)} zum letzten Mal` : "Erster Eintrag im Zeitraum"}</div></div>
        <div style="text-align:right"><div class="k">Rekord</div><div class="v" style="font-size:20px">${fmtN(best, weighted ? 1 : 0)}${unitD}</div>${lastP.y >= best && pts.length > 1 ? `<div class="d">🏆 neuer Rekord</div>` : ""}</div></div>
        ${lineChart([{ color: "var(--accent)", pts }], { unit: unitD, dec: weighted ? 1 : 0 })}`;
    } else html += `<div class="empty">Keine Einträge für diese Übung im Zeitraum.</div>`;
    html += `</div>`;
  }

  /* --- 4. Körpergewicht --- */
  const wDaysAll = Object.values(S.days).filter(d => d.weight && (d.weight.am || d.weight.pm) && d.date >= from).sort((a, b) => a.date.localeCompare(b.date));
  html += `<div class="card perf-card">`;
  if (wDaysAll.length) {
    const am = wDaysAll.filter(d => d.weight.am).map(d => ({ x: d.date, y: numv(d.weight.am) }));
    const pm = wDaysAll.filter(d => d.weight.pm).map(d => ({ x: d.date, y: numv(d.weight.pm) }));
    const main = am.length ? am : pm, lastW = main[main.length - 1];
    const weekAgo = keyOf(addDays(fromKey(lastW.x), -7));
    const ref = [...main].reverse().find(p => p.x <= weekAgo);
    const last7 = main.filter(p => p.x > keyOf(addDays(new Date(), -7)));
    html += `<div class="perf-head"><div><div class="k">Körpergewicht ${am.length ? "morgens" : "abends"}</div><div class="v">${fmtN(lastW.y, 1)} kg</div>
        <div class="d">${ref ? `${deltaTxt(lastW.y, ref.y, "kg", 1)} in 7 Tagen` : "Noch keine Woche Daten"}</div></div>
      <div style="text-align:right"><div class="k">Ø 7 Tage</div><div class="v" style="font-size:20px">${last7.length ? fmtN(last7.reduce((a, p) => a + p.y, 0) / last7.length, 1) + " kg" : "–"}</div></div></div>
      ${lineChart([{ name: "Morgens", color: "var(--accent)", pts: am.map(p => ({ ...p, tip: `${dShort(p.x)} morgens: ${fmtN(p.y, 1)} kg` })) },
                   { name: "Abends", color: "var(--muted)", dash: true, label: false, pts: pm.map(p => ({ ...p, tip: `${dShort(p.x)} abends: ${fmtN(p.y, 1)} kg` })) }].filter(x => x.pts.length), { unit: " kg", dec: 1 })}
      ${am.length && pm.length ? `<div class="legend2"><span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="var(--accent)" stroke-width="2"/></svg>Morgens</span>
        <span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/></svg>Abends</span></div>` : ""}`;
  } else html += `<div class="k" style="font-size:13px;color:var(--muted);font-weight:600">Körpergewicht</div><div class="empty">Trag auf der Startseite dein Gewicht morgens und abends ein, dann siehst du hier den Verlauf.</div>`;
  html += `</div>`;

  /* --- 5. Laufen --- */
  const runs = cardioEntries(all).filter(r => r.date >= from);
  if (runs.length) {
    const km = runs.reduce((a, r) => a + r.km, 0);
    const paces = runs.filter(r => r.min > 0).map(r => r.min / r.km);
    const bestPace = paces.length ? Math.min(...paces) : null;
    const pf = p => paceOf(1, p);
    // pro Tag zusammenfassen
    const byDay = {}; for (const r of runs) { const d = (byDay[r.date] ||= { km: 0, min: 0, names: [] }); d.km += r.km; d.min += r.min; d.names.push(r.name); }
    const days = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0])).slice(-10);
    html += `<div class="card perf-card"><div class="perf-head"><div><div class="k">Ausdauer</div><div class="v">${fmtN(km, 1)} km</div><div class="d">${runs.length} Einheiten im Zeitraum</div></div>
      <div style="text-align:right"><div class="k">Beste Pace</div><div class="v" style="font-size:20px">${bestPace ? pf(bestPace) : "–"}</div><div class="d">min/km</div></div></div>
      ${barChart(days.map(([k, d]) => ({ label: dShort(k), y: d.km, showVal: true,
        tip: `${dShort(k)}: ${fmtN(d.km, 1)} km${d.min ? ` in ${paceOf(1, d.min)} min (${pf(d.min / d.km)} min/km)` : ""} · ${[...new Set(d.names)].join(", ")}` })), { dec: 1 })}</div>`;
  }

  /* --- 6. Konsistenz: Quote pro Woche --- */
  const weeks = [...Array(8)].map((_, i) => {
    const mon = addDays(today, -((today.getDay() + 6) % 7) - (7 - i) * 7);
    let full = 0, cnt = 0;
    for (let j = 0; j < 7; j++) { const k = keyOf(addDays(mon, j)); if (k > todayKey()) continue; cnt++; if (dayInfo(k).complete) full++; }
    return { label: dShort(keyOf(mon)), y: cnt ? Math.round(full / cnt * 100) : 0, showVal: true, hl: i === 7, dim: i === 7,
      tip: `Woche ab ${dShort(keyOf(mon))}: ${full} von ${cnt} Tagen erfüllt` };
  });
  html += `<div class="card perf-card"><div class="perf-head"><div><div class="k">Konsistenz</div><div class="v">${weeks[6].y} %</div>
      <div class="d">Tagesquote letzte Woche ${deltaTxt(weeks[6].y, weeks[5].y, "Pkt.", 0)}</div></div></div>
    ${barChart(weeks, { unit: "%" })}<div class="note">Anteil der Tage pro Woche, an denen alle täglichen Aufgaben erledigt waren. Die laufende Woche ist heller.</div></div>`;

  v.innerHTML = html;
}

async function saveTypeForm() {
  const f = S.planForm, name = $("#typeName").value.trim();

async function deleteType(i) {
  const t = TYPES[i]; if (!t) return;
  const used = Object.entries(WEEK).filter(([, n]) => n === t.name).map(([d]) => WD[d]);

}

/* ===================== ÜBUNGEN PER DRAG & DROP SORTIEREN ===================== */
let pend = null, drag = null;
document.addEventListener("pointerdown", e => {
  const card = e.target.closest("#exList .ex[data-ex]"); if (!card || drag) return;
  if (e.target.closest("input, textarea, button, select")) return;
  const HOLD = 1500;   // so lange gedrückt halten (ms), bis die Übung verschoben werden kann
  pend = { card, x: e.clientX, y: e.clientY,
    h: setTimeout(() => card.classList.add("holding"), 250),
    t: setTimeout(() => { if (pend) { const p = pend; pend = null; p.card.classList.remove("holding"); startDrag(p.card, p.y); } }, HOLD) };
});
document.addEventListener("pointermove", e => {
  if (pend && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) > 10) cancelPend();
  if (drag) moveDrag(e.clientY);
});
function cancelPend() { if (!pend) return; clearTimeout(pend.t); clearTimeout(pend.h); pend.card.classList.remove("holding"); pend = null; }
const endPointer = () => { cancelPend(); if (drag) endDrag(); };
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", endPointer);
document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", e => { if (e.target.closest("#exList .ex")) e.preventDefault(); });

function startDrag(card, y) {
  const list = $("#exList"); if (!list) return;
  // Alle Übungen kompakt anzeigen, damit man nicht weit ziehen muss; Liste bleibt unter dem Finger
  const before = card.getBoundingClientRect().top;
  list.classList.add("compact");
  const after = card.getBoundingClientRect().top;
  scrollBy(0, after - y + 28);   // Kopf der Übung wieder unter den Finger holen
  const r = card.getBoundingClientRect();
  const ph = document.createElement("div"); ph.className = "ex-ph"; ph.style.height = r.height + "px";
  card.parentNode.insertBefore(ph, card);
  card.classList.add("dragging");
  const off = Math.min(28, r.height / 2);   // Karte sitzt immer direkt unter dem Finger
  Object.assign(card.style, { left: r.left + "px", top: (y - off) + "px", width: r.width + "px" });
  document.body.classList.add("drag-on");
  drag = { card, ph, list, off, y, h: r.height };
  moveDrag(y);
  try { navigator.vibrate?.(25); } catch {}
  drag.tick = setInterval(() => {   // automatisch scrollen am Bildschirmrand
    if (!drag) return;
    const edge = 90, h = innerHeight - 70;
    if (drag.y < edge) { scrollBy(0, -10); moveDrag(drag.y); }
    else if (drag.y > h - edge) { scrollBy(0, 10); moveDrag(drag.y); }
  }, 16);
}
function moveDrag(y) {
  const d = drag; d.y = y;
  d.card.style.top = (y - d.off) + "px";
  const others = [...d.list.querySelectorAll(".ex[data-ex]")].filter(c => c !== d.card);
  const cy = y - d.off + d.h / 2;   // Mitte der gezogenen Übung
  const before = others.find(c => { const r = c.getBoundingClientRect(); return cy < r.top + r.height / 2; });
  if (before) { if (d.ph.nextSibling !== before) d.list.insertBefore(d.ph, before); }
  else if (d.ph !== d.list.lastElementChild) d.list.appendChild(d.ph);
}
function endDrag() {
  const d = drag; drag = null; clearInterval(d.tick);
  document.body.classList.remove("drag-on");
  d.list.classList.remove("compact");
  const order = [...d.list.children].map(el => el === d.ph ? +d.card.dataset.ex : el.classList.contains("ex") && el !== d.card ? +el.dataset.ex : null).filter(x => x !== null);
  const old = S.workout.exercises, changed = order.some((v, i) => v !== i);
  if (changed) { S.workout.exercises = order.map(i => old[i]); saveWorkout(true); }
  else renderTrain();
}

async function renameExercise(i) {
  const e = S.workout.exercises[i]; if (!e) return;
  const oldN = e.name, newN = $("#exNewName").value.trim(), g = e.group;
  if (!newN || newN === oldN) { closeSheet(); return; }
  // 1) heutiges Training
  e.name = newN;
  // 2) Übungsauswahl (Vorschläge): eigene Übung ersetzen bzw. Standard-Übung aus-/neue einblenden
  let found = false;
  for (const grp of new Set([...Object.keys(LIB), ...Object.keys(S.custom)])) {   // in jeder Gruppe, in der die Übung vorkommt
    if ((S.custom[grp] || []).includes(oldN)) { S.custom[grp] = S.custom[grp].map(x => x === oldN ? newN : x); found = true; }
    else if ((LIB[grp] || []).includes(oldN) && !(S.hidden[grp] || []).includes(oldN)) {
      (S.hidden[grp] ||= []).push(oldN); (S.custom[grp] ||= []).includes(newN) || S.custom[grp].push(newN); found = true; }
  }
  if (!found) { const grp = LIB[g] ? g : "Sonstiges"; (S.custom[grp] ||= []).includes(newN) || S.custom[grp].push(newN); }
  if (S.exModes?.[oldN]) { S.exModes[newN] = S.exModes[oldN]; delete S.exModes[oldN]; }
  try { await setDoc(userRef(), { custom: S.custom, hidden: S.hidden, exModes: S.exModes || {} }, { merge: true }); } catch {}
  // 3) optional frühere Trainings
  if (S.renHist) {
    for (const w of (S.allWo || []).filter(w => w.date !== S.trainDate && (w.exercises || []).some(x => x.name === oldN))) {
      w.exercises = w.exercises.map(x => x.name === oldN ? { ...x, name: newN } : x);
      w.prs = (w.prs || []).map(t => t.startsWith(oldN + "|") ? newN + t.slice(oldN.length) : t);
      try { await setDoc(woRef(w.date), Object.fromEntries(Object.entries(w).filter(([k]) => k !== "id"))); } catch {}
    }
    prevFor = null; for (const n in lastCache) delete lastCache[n];
    await loadPrevious(S.trainDate);
  }
  delete lastCache[oldN]; await loadLastFor([newN]);
  closeSheet(); saveWorkout(true);
  toast(`Umbenannt in „${newN}“`);

// Rekordwert einer Übung je nach Messart (höher = besser)
function prValue(e) {
  const m = exMode(e), sets = e.sets || [];
  if (m === "cardio") return Math.max(0, ...sets.map(x => numv(x.km)));
  if (m === "time") return Math.max(0, ...sets.map(x => numv(x.sec)));
  if (m === "weight") return Math.max(0, ...sets.map(setScore));
  return Math.max(0, ...sets.map(x => numv(x.reps)));
}
function prText(e) {
  const m = exMode(e), sets = (e.sets || []).filter(setFilled);
  if (!sets.length) return "";
  const best = [...sets].sort((a, b) => prValue({ ...e, sets: [b] }) - prValue({ ...e, sets: [a] }))[0];
  return setTxt(best, m) + (m === "band" || m === "reps" ? (m === "band" ? " Wdh." : "") : "");
}
// Bester bisheriger Wert vor einem Datum (gleiche Übung, gleiche Messart)
function bestBefore(name, mode, date) {
  let best = 0;
  for (const w of S.allWo || []) {
    if (w.date >= date) continue;
    for (const e of w.exercises || []) if (e.name === name && exMode(e) === mode) best = Math.max(best, prValue(e));
  }
  return best;
}
function checkPR(i) {
  const e = S.workout?.exercises?.[i]; if (!e || !S.allWo) return;
  const cur = prValue(e), prev = bestBefore(e.name, exMode(e), S.trainDate);
  const tag = e.name + "|" + exMode(e);
  if (prev > 0 && cur > prev && !(S.workout.prs || []).includes(tag)) {
    (S.workout.prs ||= []).push(tag);
    const m = exMode(e), pv = m === "reps" || m === "band" ? `${fmtN(prev, 0)} Wdh.` : m === "cardio" ? `${fmtN(prev, 2)} km` : "";
    prShow(e.name, m, prText(e), pv);
    saveWorkout();
  }
}
// Lauf-Rekorde: schnellstes Tempo (ab 1 km) und weiteste Strecke
function runBest(date) { let km = 0, pace = Infinity, kmD = "", paceD = "";
  for (const w of S.allWo || []) { if (date && w.date >= date) continue; const k = numv(w.run?.km), m = parseDur(w.run?.minutes);
    if (k > km) { km = k; kmD = w.date; } if (k >= 1 && m > 0 && m / k < pace) { pace = m / k; paceD = w.date; } } return { km, pace, kmD, paceD }; }

function checkRunPR() {
  const w = S.workout; if (!w || !S.allWo) return; const k = numv(w.run?.km), m = parseDur(w.run?.minutes); if (!(k > 0)) return;

  if (m > 0 && k >= 1 && b.pace < Infinity && m / k < b.pace - 1e-9 && !prs.includes("run|pace")) { prs.push("run|pace"); saveWorkout(); prShow("Laufen – schnellstes Tempo", "pace", `${fmtPace(m / k)} auf ${fmtN(k, 2)} km`, fmtPace(b.pace), "TEMPO"); return; }
  if (b.km > 0 && k > b.km && !prs.includes("run|km")) { prs.push("run|km"); saveWorkout(); prShow("Laufen – weiteste Strecke", "run", `${fmtN(k, 2)} km`, `${fmtN(b.km, 2)} km`, "STRECKE"); }

    head = `${MONTHS[mo]} ${y}`;

      <div class="seg" style="margin-bottom:12px"><button class="chip ${mode === "week" ? "accent" : ""}" data-action="calmode" data-v="week">Woche</button>

/* ===================== WELTEN: gezeichnete Hintergründe aus Ebenen =====================

/* ----- Welt: Wüste bei Sonnenuntergang ----- */
// Saguaro-Kaktus mit Armen und Rippen (Fuß unten Mitte)
WLD.saguaro = (w, h, o = {}) => { const { r, f, ch, pick } = WLD; const base = o.c || "#3f7d4a", dk = o.d || "#2c5e38", lt = o.l || "#6aa86a", flower = o.flower;

    return t; };

    let t = `<path d="M${f(ax)} ${f(y - aw / 2)}H${f(ex - side * aw / 2)}Q${f(ex)} ${f(y - aw / 2)} ${f(ex)} ${f(y - aw)}V${f(y - up)}" stroke="${base}" stroke-width="${f(aw)}" fill="none" stroke-linecap="round"/>`;

const noAnim = svg => svg.replace(/<animate(Transform)?\b[^>]*\/>/g, "").replace(/<animate(Transform)?\b[^>]*>[\s\S]*?<\/animate(Transform)?>/g, "");
let decoSt = null, decoFull = null;
function decoAnim(full) {
  if (decoFull === full) return; decoFull = full; const P = full ? (x => x) : noAnim;
  const url = svg => `url("data:image/svg+xml,${encodeURIComponent(P(svg))}")`;
  const sel = (k, n, i) => `:root[data-deco=${k}] .app > section:not(#view-perf) .card:not(.shine):nth-child(${n}n+${i + 1})::before`;
  let css = "";

  DECO2.overgrown.forEach((v, i, all) => { css += `${sel("overgrown", all.length, i)}{background-image:${url(v.corner)},${url(v.hang)},${url(v.strip)},${url(v.clump)};background-repeat:no-repeat,no-repeat,repeat-x,no-repeat;background-position:left top,${v.hx}% top,left top,right bottom;background-size:92px 92px,30px 86px,200px 31px,96px 44px}\n`; });

    css += `${sel("blossom", all.length, i)}{background-image:${url(v.top)},${url(v.side)},${url(v.field)};background-position:${a} top,${b} top,0 0;background-size:auto 76px,auto 150px,100% 100%}\n`; });

/* ===================== UHRZEIT: ZEIGER-UHR + RAD (laufen zusammen) ===================== */
const TW_H = 44;                    // Höhe einer Zeile im Rad
const TW_SPEED = { h: 1, m: 2 };    // Minuten drehen doppelt so schnell
function timeWheel(id, val = "08:00") {
  const [h, m] = val.split(":").map(Number);
  const col = (part, n, cur) => `<div class="tw-col" data-part="${part}">
      <div class="tw-pad"></div>${[...Array(n)].map((_, i) => `<div class="tw-it ${i === cur ? "on" : ""}" data-i="${i}">${pad(i)}</div>`).join("")}<div class="tw-pad"></div></div>`;
  return `<div class="tw-box" id="${id}" data-val="${pad(h)}:${pad(m)}" data-dial="h">
      <div class="dial-tabs"><button data-dialmode="h" class="on">Stunden</button><button data-dialmode="m">Minuten</button></div>
      <svg class="dial" viewBox="0 0 240 240"></svg>
      <div class="tw"><div class="tw-hl"></div>${col("h", 24, h)}<div class="tw-sep">:</div>${col("m", 60, m)}</div>
      <div class="tw-quick">${["07:00", "12:00", "18:00", "19:30", "21:00"].map(t => `<button class="chip" data-twq="${id}" data-v="${t}">${t}</button>`).join("")}</div>
    </div>`;
}
const twVal = id => $("#" + id)?.dataset.val || "";
// --- Zeiger-Uhr zeichnen ---
function drawDial(box) {
  const svg = box.querySelector(".dial"), mode = box.dataset.dial, [h, m] = box.dataset.val.split(":").map(Number);
  const pos = (ang, r) => [120 + r * Math.sin(ang * Math.PI / 180), 120 - r * Math.cos(ang * Math.PI / 180)];
  let g = `<circle cx="120" cy="120" r="116" fill="var(--surface-2)"/>`;
  let selAng, selR, selTxt;
  if (mode === "h") {
    const inner = h === 0 || h > 12;
    selAng = (h % 12) * 30; selR = inner ? 62 : 94; selTxt = pad(h);
    g += `<line x1="120" y1="120" x2="${pos(selAng, selR)[0]}" y2="${pos(selAng, selR)[1]}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>`;
    g += `<circle cx="${pos(selAng, selR)[0]}" cy="${pos(selAng, selR)[1]}" r="19" fill="var(--accent)"/>`;
    for (let i = 0; i < 12; i++) {
      const o = i === 0 ? 12 : i, n = i === 0 ? 0 : i + 12;
      const [ox, oy] = pos(i * 30, 94), [ix, iy] = pos(i * 30, 62);
      g += `<text x="${ox}" y="${oy + 5.5}" text-anchor="middle" font-size="16" font-weight="700" fill="${o === h ? "var(--accent-ink)" : "var(--text)"}">${o}</text>`;
      g += `<text x="${ix}" y="${iy + 4.5}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${n === h ? "var(--accent-ink)" : "var(--muted)"}">${pad(n)}</text>`;
    }
  } else {
    selAng = m * 6; selR = 94;
    g += `<line x1="120" y1="120" x2="${pos(selAng, selR)[0]}" y2="${pos(selAng, selR)[1]}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>`;
    g += `<circle cx="${pos(selAng, selR)[0]}" cy="${pos(selAng, selR)[1]}" r="19" fill="var(--accent)"/>`;
    for (let i = 0; i < 60; i++) {
      if (i % 5) { const [tx, ty] = pos(i * 6, 106), [tx2, ty2] = pos(i * 6, 101); g += `<line x1="${tx}" y1="${ty}" x2="${tx2}" y2="${ty2}" stroke="var(--muted)" stroke-width="1.5" opacity=".5"/>`; continue; }
      const [x, y] = pos(i * 6, 94);
      g += `<text x="${x}" y="${y + 5.5}" text-anchor="middle" font-size="16" font-weight="700" fill="${i === m ? "var(--accent-ink)" : "var(--text)"}">${pad(i)}</text>`;
    }
    if (m % 5) { const [x, y] = pos(selAng, selR); g += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--accent-ink)">${pad(m)}</text>`; }
  }
  g += `<circle cx="120" cy="120" r="5" fill="var(--accent)"/>`;
  svg.innerHTML = g;
  box.querySelectorAll("[data-dialmode]").forEach(b => b.classList.toggle("on", b.dataset.dialmode === mode));
}
// --- Rad: eigene Wisch-Steuerung mit Schwung (Minuten ×2) ---
function colIndex(c) { return Math.max(0, Math.min(c.dataset.part === "h" ? 23 : 59, Math.round(c.scrollTop / TW_H))); }
function markWheel(c) { const i = colIndex(c); c.querySelectorAll(".tw-it").forEach(b => b.classList.toggle("on", +b.dataset.i === i)); return i; }
function setPart(box, part, i) {
  const [h, m] = box.dataset.val.split(":");
  box.dataset.val = part === "h" ? `${pad(i)}:${m}` : `${h}:${pad(i)}`;
  drawDial(box);
}
function snapCol(c) {
  const i = markWheel(c);
  c.scrollTo({ top: i * TW_H, behavior: "smooth" });
  setPart(c.closest(".tw-box"), c.dataset.part, i);
}
function initWheels() {
  document.querySelectorAll(".tw-box").forEach(box => {
    if (box.dataset.ready) return; box.dataset.ready = 1;
    const [h, m] = box.dataset.val.split(":").map(Number);
    box.querySelectorAll(".tw-col").forEach(c => {
      c.scrollTop = (c.dataset.part === "h" ? h : m) * TW_H;
      const f = TW_SPEED[c.dataset.part];
      let st = null, anim = null, wt;
      c.addEventListener("pointerdown", e => {
        cancelAnimationFrame(anim);
        st = { y: e.clientY, top: c.scrollTop, moved: false, hist: [[e.timeStamp, e.clientY]], target: e.target };
        c.setPointerCapture(e.pointerId);
      });
      c.addEventListener("pointermove", e => {
        if (!st) return;
        const dy = e.clientY - st.y;
        if (Math.abs(dy) > 4) st.moved = true;
        c.scrollTop = st.top - dy * f; markWheel(c);
        st.hist.push([e.timeStamp, e.clientY]); if (st.hist.length > 6) st.hist.shift();
      });
      const up = e => {
        if (!st) return;
        const s0 = st; st = null;
        if (!s0.moved) {   // Tippen auf eine Zahl
          const it = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tw-it");
          if (it && c.contains(it)) { c.scrollTo({ top: +it.dataset.i * TW_H, behavior: "smooth" }); setPart(c.closest(".tw-box"), c.dataset.part, +it.dataset.i); }
          return;
        }
        const [t0, y0] = s0.hist[0], [t1, y1] = s0.hist[s0.hist.length - 1];
        let v = t1 > t0 ? -(y1 - y0) / (t1 - t0) * f : 0;   // px pro ms
        let last = performance.now();
        const step = now => {
          const dt = now - last; last = now;
          c.scrollTop += v * dt; v *= Math.pow(0.94, dt / 16); markWheel(c);
          if (Math.abs(v) > 0.05) anim = requestAnimationFrame(step); else snapCol(c);
        };
        if (Math.abs(v) > 0.25) anim = requestAnimationFrame(step); else snapCol(c);
      };
      c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
      c.addEventListener("wheel", e => { e.preventDefault(); c.scrollTop += e.deltaY * f; markWheel(c); clearTimeout(wt); wt = setTimeout(() => snapCol(c), 120); }, { passive: false });
    });
    // Zeiger-Uhr bedienen
    const svg = box.querySelector(".dial");
    const pick = (e, release) => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 240 - 120, y = (e.clientY - r.top) / r.height * 240 - 120;
      const ang = (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360, dist = Math.hypot(x, y);
      if (box.dataset.dial === "h") {
        const i = Math.round(ang / 30) % 12, inner = dist < 78;
        const hv = inner ? (i === 0 ? 0 : i + 12) : (i === 0 ? 12 : i);
        setWheelVal(box, `${pad(hv)}:${box.dataset.val.slice(3)}`);
        if (release) { box.dataset.dial = "m"; drawDial(box); }
      } else {
        const mv = Math.round(ang / 6) % 60;
        setWheelVal(box, `${box.dataset.val.slice(0, 2)}:${pad(mv)}`);
      }
    };
    svg.onpointerdown = e => { e.preventDefault(); svg.setPointerCapture(e.pointerId); pick(e); svg.onpointermove = ev => pick(ev); };
    svg.onpointerup = e => { svg.onpointermove = null; pick(e, true); };
    svg.onpointercancel = () => { svg.onpointermove = null; };
    drawDial(box);
  });
}
function setWheelVal(box, val) {
  box.dataset.val = val;
  const [h, m] = val.split(":").map(Number);
  box.querySelectorAll(".tw-col").forEach(c => { const i = c.dataset.part === "h" ? h : m; c.scrollTo({ top: i * TW_H, behavior: "smooth" }); c.querySelectorAll(".tw-it").forEach(b => b.classList.toggle("on", +b.dataset.i === i)); });
  drawDial(box);
}
function setWheel(id, val) { const box = $("#" + id); if (box) setWheelVal(box, val); }
document.addEventListener("click", e => {
  const q = e.target.closest("[data-twq]");
  if (q) { setWheel(q.dataset.twq, q.dataset.v); return; }
  const dm = e.target.closest("[data-dialmode]");
  if (dm) { const box = dm.closest(".tw-box"); box.dataset.dial = dm.dataset.dialmode; drawDial(box); }
});

/* ===================== FARBWÄHLER (eigene Farbe) ===================== */
const hexOk = h => /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h.trim());
const normHex = h => { h = h.trim().replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); return "#" + h.toUpperCase(); };
const hex2rgb = h => { h = normHex(h).slice(1); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const rgb2hex = (r, g, b) => "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("").toUpperCase();
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, mx ? d / mx : 0, mx];
}
function hsv2rgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5) * 255, f(3) * 255, f(1) * 255];
}
function openColorPicker() {

    </div>
    <div class="cp-rgb">${["R", "G", "B"].map((l, i) => `<div class="field" style="margin:0"><label>${l}</label><input class="num-in" id="cp${l}" inputmode="numeric" maxlength="3"></div>`).join("")}</div>

    el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };

    S.cp.hsv[1] = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); S.cp.hsv[2] = 1 - Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); cpRender(true); });

// Anzeige aktualisieren; fields=false lässt das gerade bearbeitete Feld in Ruhe
function cpRender(fields, skip) {
  const [h, sat, v] = S.cp.hsv, rgb = hsv2rgb(h, sat, v), hex = rgb2hex(...rgb);

  Object.assign($("#cpDot").style, { left: sat * 100 + "%", top: (1 - v) * 100 + "%", background: hex });
  Object.assign($("#cpThumb").style, { left: h / 360 * 100 + "%", background: `hsl(${h}, 100%, 50%)` });
  $("#cpNew").style.background = hex;

function cpFromInput(t) {

  } else {

let swReg = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(r => { swReg = r; registerPeriodic(); applyPending(); }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data?.type === "refresh") applyPending(); });
}
async function enableNotifications() {
  const p = await Notification.requestPermission();
  if (p === "granted") { toast("Benachrichtigungen sind an"); registerPeriodic(); saveReminderState(); }
  else toast("Benachrichtigungen wurden nicht erlaubt");
  renderStart();
  if (!$("#sheet").classList.contains("hidden")) openSettings();
}
async function registerPeriodic() {
  try {
    if (!swReg || !("periodicSync" in swReg)) return;
    const st = await navigator.permissions.query({ name: "periodic-background-sync" });
    if (st.state === "granted") await swReg.periodicSync.register("tracker-reminder", { minInterval: 60 * 60 * 1000 });
  } catch {}
}
// Offene Punkte von heute als einzelne Einträge (jeder wird eine eigene Benachrichtigung mit „✓ Erledigt“)
function openItemsToday() {
  const k = todayKey(), done = S.days[k]?.done || {};
  const tasks = tasksFor(new Date()).filter(t => !done[t.key]).map(t => ({ id: "task-" + t.key, key: t.key, t: t.t, kind: t.kind === "weight" ? "weight" : "task" }));
  const todos = todosForToday().filter(t => !t.done).map(t => ({ id: "todo-" + t.id, todoId: t.id, t: t.text, kind: "todo" }));
  return [...tasks, ...todos];
}
function openTasksToday() { return openItemsToday().map(i => (i.kind === "todo" ? "To-Do: " : "") + i.t); }
// Gemeinsamer Plan für App und Service Worker
function reminderPlan() {
  const k = todayKey(), done = S.days[k]?.done || {};
  return {
    date: k, total: tasksFor(new Date()).length, general: REMIND_TIMES, items: openItemsToday(),
    tasks: [...tasksFor(new Date()).flatMap(t => remindsOf(t).map(time => ({ id: "task-" + t.key, key: t.key, t: t.t, time, done: !!done[t.key], kind: t.kind === "weight" ? "weight" : "task" }))),
      ...S.todos.filter(t => !t.done && t.remind && (!t.due || t.due <= k)).map(t => ({ id: "todo-" + t.id, key: "todo" + t.id, todoId: t.id, t: t.text, time: t.remind, done: false, kind: "todo" }))],
    pushOn: !!S.pushOn,
  };
}
async function readState() {
  const c = await caches.open("tracker-state");
  return { c, st: await c.match("state").then(r => r ? r.json() : {}).catch(() => ({})) };
}
async function saveReminderState() {
  try { const { c, st } = await readState(); const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || st.accent;
    await c.put("state", new Response(JSON.stringify({ ...st, plan: reminderPlan(), accent }))); } catch {}
  writePushCfg();
}
// Fällige Erinnerungen → Pakete mit Einträgen (höchstens 90 Minuten alt)
function dueNotifications(plan, fired, nowMin) {
  const out = [];
  const recent = t => toMin(t) <= nowMin && nowMin - toMin(t) <= 90;
  const gen = plan.general.filter(recent).filter(t => !fired.includes("g" + t)).pop();
  if (gen) out.push({ id: "g" + gen, items: plan.items });
  plan.general.filter(t => toMin(t) <= nowMin).forEach(t => { if (!fired.includes("g" + t) && t !== gen) out.push({ id: "g" + t, items: [] }); });
  for (const t of plan.tasks) {
    const id = "t" + t.key + t.time;
    if (fired.includes(id) || toMin(t.time) > nowMin) continue;
    out.push({ id, items: !t.done && recent(t.time) ? [t] : [] });
  }
  return out;
}
async function checkReminder() {
  if (!S.uid || !("Notification" in window) || Notification.permission !== "granted" || !swReg) return;
  if (S.pushOn) return;   // Push vom Server übernimmt die Erinnerungen
  const now = new Date(), plan = reminderPlan();
  const { c, st } = await readState();
  const fired = st.firedDate === plan.date ? (st.fired || []) : [];
  const due = dueNotifications(plan, fired, now.getHours() * 60 + now.getMinutes());
  if (!due.length) return;
  const items = [], seen = new Set();
  for (const n of due) { fired.push(n.id); for (const it of n.items) if (!seen.has(it.id)) { seen.add(it.id); items.push(it); } }
  if (items.length) (swReg.active || navigator.serviceWorker.controller)?.postMessage({ type: "show", payload: { date: plan.date, total: plan.total, items } });
  await c.put("state", new Response(JSON.stringify({ ...st, plan, firedDate: plan.date, fired })));
}
// Abhaken aus der Benachrichtigung, das der Service Worker nicht direkt speichern konnte, jetzt nachholen
async function applyPending() {
  if (!S.uid) return;
  try {
    const { c, st } = await readState();
    const pend = st.pending || []; if (!pend.length) return;
    await c.put("state", new Response(JSON.stringify({ ...st, pending: [] })));
    for (const p of pend) {
      if (p.kind === "todo") { const t = S.todos.find(x => x.id === p.todoId); if (t && !t.done) await toggleTodo(p.todoId); }
      else if (p.date === todayKey() && !S.days[p.date]?.done?.[p.key]) await toggleTask(p.date, p.key);
    }
    toast(`${pend.length} Punkt${pend.length > 1 ? "e" : ""} aus Benachrichtigungen abgehakt ✓`);
  } catch {}
}

/* ---------- Push vom Server (auch wenn die App geschlossen ist) ---------- */
let pushCfgT;
function writePushCfg() {
  if (!S.uid || !S.pushOn) return;
  clearTimeout(pushCfgT);
  pushCfgT = setTimeout(() => {
    const weekNames = {}, restDays = [];
    for (let d = 0; d < 7; d++) { const p = planFor(d); weekNames[d] = p.name; if (p.type === "rest") restDays.push(d); }
    const cfg = {
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Berlin",
      general: REMIND_TIMES, weekNames, restDays,
      tasks: (S.taskCfg || DEFAULT_TASKS).map(t => ({ key: t.key, t: t.t || "Training", days: t.days || null, remind: remindsOf(t)[0] || null, reminds: remindsOf(t), training: !!t.training, kind: t.kind || null })),
    };
    setDoc(userRef(), { push: { enabled: true, cfg } }, { merge: true }).catch(() => {});
  }, 800);
}
async function enablePush() {
  if (!VAPID_KEY) { toast("Push ist noch nicht eingerichtet (Schlüssel fehlt)"); return; }
  try {
    if (Notification.permission !== "granted" && (await Notification.requestPermission()) !== "granted") { toast("Benachrichtigungen wurden nicht erlaubt"); return; }
    const { getMessaging, getToken, isSupported } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    if (!(await isSupported())) { toast("Push wird von diesem Browser nicht unterstützt"); return; }
    const reg = swReg || await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error("kein Token");
    const u = await getDoc(userRef());
    const tokens = [...new Set([...(u.data()?.push?.tokens || []), token])].slice(-5);
    await setDoc(userRef(), { push: { enabled: true, tokens } }, { merge: true });
    S.pushOn = true; writePushCfg(); saveReminderState();
    toast("Push ist an – auch bei geschlossener App 🔔");
    openSettings();
  } catch (e) { toast("Push konnte nicht aktiviert werden: " + (e.code || e.message)); }
}
async function disablePush() {
  S.pushOn = false;
  try { await setDoc(userRef(), { push: { enabled: false } }, { merge: true }); } catch {}
  saveReminderState(); openSettings(); toast("Push ist aus");
}
setInterval(() => {
  if (S.uid && todayKey() !== S.curToday) { watchToday(); renderAll(); }   // Tageswechsel um Mitternacht
  checkReminder();
}, 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkReminder(); });
</script>
